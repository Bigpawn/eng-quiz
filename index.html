<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>学位英语刷题本</title>
    <style>
      :root {
        --blue: #2563eb;
        --blue-l: #eff6ff;
        --green: #16a34a;
        --green-l: #dcfce7;
        --red: #dc2626;
        --red-l: #fee2e2;
        --ink: #1e293b;
        --sub: #64748b;
        --line: #e2e8f0;
        --bg: #eef1f6;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.65 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          sans-serif;
      }
      #app {
        max-width: 780px;
        margin: 0 auto;
        padding: 0 12px 60px;
      }
      /* ---------- 首页 ---------- */
      .hero {
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: #fff;
        border-radius: 16px;
        padding: 22px 20px;
        margin: 14px 0 12px;
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
      }
      .hero h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      .hero p {
        margin: 0;
        opacity: 0.92;
        font-size: 13.5px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .chip {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12.5px;
        color: var(--sub);
      }
      .chip b {
        color: var(--ink);
      }
      .mode {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-align: left;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 15px 16px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: 0.15s;
        font: inherit;
      }
      .mode:active {
        transform: scale(0.985);
      }
      .mode:hover {
        border-color: #93c5fd;
        box-shadow: 0 3px 10px rgba(37, 99, 235, 0.08);
      }
      .mode .ic {
        font-size: 26px;
        width: 40px;
        text-align: center;
        flex: none;
      }
      .mode .tt {
        flex: 1;
      }
      .mode .tt b {
        display: block;
        font-size: 16px;
      }
      .mode .tt span {
        font-size: 12.5px;
        color: var(--sub);
      }
      .mode .arrow {
        color: #94a3b8;
        font-size: 18px;
      }
      .foot {
        color: #94a3b8;
        font-size: 12px;
        text-align: center;
        margin-top: 18px;
        line-height: 1.9;
      }
      .linkbtn {
        background: none;
        border: none;
        color: #94a3b8;
        text-decoration: underline;
        font-size: 12px;
        cursor: pointer;
        padding: 0;
      }
      /* ---------- 顶栏 ---------- */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: #fff;
        margin: 0 -12px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 2px 10px rgba(30, 41, 59, 0.15);
      }
      .topbar .t {
        font-weight: 600;
        font-size: 15px;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbar .m {
        font-size: 12px;
        opacity: 0.9;
        white-space: nowrap;
      }
      .tbtn {
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #fff;
        border-radius: 8px;
        padding: 5px 11px;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tbtn.main {
        background: #fff;
        color: var(--blue);
        border-color: #fff;
        font-weight: 600;
      }
      /* ---------- 卡片与题目 ---------- */
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 14px 15px;
        margin: 12px 0;
      }
      .sech {
        margin: 22px 0 4px;
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .sech b {
        font-size: 16.5px;
      }
      .sech span {
        font-size: 12.5px;
        color: var(--sub);
      }
      .qhead {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .qnum {
        background: var(--blue);
        color: #fff;
        border-radius: 7px;
        min-width: 30px;
        text-align: center;
        font-weight: 700;
        font-size: 13px;
        padding: 1px 6px;
      }
      .src {
        font-size: 11.5px;
        color: #94a3b8;
      }
      .badge {
        font-size: 11.5px;
        border-radius: 999px;
        padding: 2px 9px;
        margin-left: auto;
        font-weight: 600;
      }
      .badge.ok {
        background: var(--green-l);
        color: #15803d;
      }
      .badge.no {
        background: var(--red-l);
        color: #b91c1c;
      }
      .badge.na {
        background: #e5e7eb;
        color: #6b7280;
      }
      .qtext {
        margin: 2px 0 10px;
        font-size: 15.5px;
      }
      .opts {
        display: grid;
        gap: 8px;
      }
      .opts.two {
        grid-template-columns: 1fr 1fr;
      }
      .opt {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        text-align: left;
        background: #fff;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 9px 11px;
        cursor: pointer;
        font: inherit;
        color: inherit;
        transition: 0.12s;
        line-height: 1.5;
      }
      .opt i {
        font-style: normal;
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1.5px solid #cbd5e1;
        color: var(--sub);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 1px;
      }
      .opt.sel {
        border-color: var(--blue);
        background: var(--blue-l);
      }
      .opt.sel i {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .opt.right {
        border-color: var(--green);
        background: var(--green-l);
      }
      .opt.right i {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .opt.wrongpick {
        border-color: var(--red);
        background: var(--red-l);
      }
      .opt.wrongpick i {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }
      .opt .tag {
        font-size: 11px;
        color: var(--sub);
        margin-left: auto;
        flex: none;
        padding-left: 6px;
      }
      /* ---------- 文章 ---------- */
      .passage {
        background: #fbfaf6;
        border: 1px solid #ece7d8;
        border-radius: 13px;
        padding: 15px 16px;
        margin: 12px 0;
        font-size: 15px;
        line-height: 1.9;
        white-space: pre-wrap;
      }
      details.passage {
        cursor: pointer;
      }
      details.passage summary {
        font-weight: 600;
        color: var(--blue);
        font-size: 13.5px;
        margin-bottom: 6px;
        cursor: pointer;
        list-style-position: inside;
      }
      .cb {
        display: inline-block;
        min-width: 1.7em;
        text-align: center;
        border: 1.5px dashed #94a3b8;
        border-radius: 6px;
        padding: 0 5px;
        margin: 0 2px;
        color: var(--blue);
        font-weight: 700;
        font-size: 12.5px;
        background: var(--blue-l);
        vertical-align: 1px;
      }
      .cb.dim {
        color: #cbd5e1;
        background: #f6f7f9;
        border-color: #e2e8f0;
      }
      .fill {
        color: #15803d;
        font-weight: 700;
        border-bottom: 2px solid #86efac;
        padding: 0 2px;
      }
      .ub {
        display: inline-block;
        min-width: 72px;
        border-bottom: 1.5px solid #b6c2d4;
        height: 0.95em;
        vertical-align: baseline;
      }
      /* ---------- 解析与翻译 ---------- */
      .expl {
        background: #f0f7ff;
        border-left: 3px solid var(--blue);
        border-radius: 0 8px 8px 0;
        padding: 9px 12px;
        font-size: 13.5px;
        margin-top: 10px;
        color: #334155;
      }
      .yours,
      .ref {
        font-size: 14px;
        margin-top: 8px;
        padding: 8px 11px;
        border-radius: 9px;
      }
      .yours {
        background: #f8fafc;
        border: 1px dashed var(--line);
        white-space: pre-wrap;
      }
      .ref {
        background: var(--green-l);
        white-space: pre-wrap;
      }
      .ref b,
      .yours b {
        font-weight: 600;
      }
      .ratebox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .ratebox span {
        font-size: 13px;
        color: var(--sub);
      }
      .rbtn {
        border: 1.5px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 5px 14px;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      .rbtn.on.y {
        background: var(--green-l);
        border-color: var(--green);
        color: #15803d;
        font-weight: 600;
      }
      .rbtn.on.n {
        background: var(--red-l);
        border-color: var(--red);
        color: #b91c1c;
        font-weight: 600;
      }
      textarea.tra {
        width: 100%;
        min-height: 70px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 9px 11px;
        font: inherit;
        resize: vertical;
        background: #fff;
      }
      textarea.tra:focus {
        outline: none;
        border-color: var(--blue);
      }
      /* ---------- 答题卡 ---------- */
      .cardpanel {
        position: sticky;
        top: 52px;
        z-index: 15;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 12px;
        margin: 10px 0;
        display: none;
      }
      .cardpanel.show {
        display: block;
      }
      .cardpanel h4 {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--sub);
      }
      .ngrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
        gap: 6px;
      }
      .ncell {
        border: 1.5px solid var(--line);
        border-radius: 8px;
        background: #fff;
        height: 34px;
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ncell.done {
        background: var(--blue-l);
        border-color: #93c5fd;
        color: var(--blue);
      }
      /* ---------- 成绩 ---------- */
      .score {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        margin: 14px 0;
      }
      .score .big {
        font-size: 40px;
        font-weight: 800;
        color: var(--blue);
        line-height: 1.1;
      }
      .score .big small {
        font-size: 16px;
        color: var(--sub);
        font-weight: 500;
      }
      table.rt {
        width: 100%;
        border-collapse: collapse;
        margin-top: 14px;
        font-size: 14px;
      }
      table.rt td,
      table.rt th {
        padding: 7px 4px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      table.rt td.r,
      table.rt th.r {
        text-align: right;
      }
      table.rt th {
        color: var(--sub);
        font-weight: 500;
        font-size: 12.5px;
      }
      .hint {
        font-size: 12.5px;
        color: #b45309;
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 9px;
        padding: 7px 11px;
        margin-top: 12px;
      }
      .rowbtns {
        display: flex;
        gap: 9px;
        margin: 14px 0;
        flex-wrap: wrap;
      }
      .bbtn {
        flex: 1;
        min-width: 120px;
        border: none;
        border-radius: 11px;
        padding: 11px;
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .bbtn.pri {
        background: var(--blue);
        color: #fff;
      }
      .bbtn.sec {
        background: #fff;
        border: 1.5px solid var(--line);
        color: var(--ink);
      }
      .bbtn.warn {
        background: #fff;
        border: 1.5px solid #fecaca;
        color: #b91c1c;
      }
      /* ---------- 其它 ---------- */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 36px;
        transform: translateX(-50%) translateY(20px);
        background: #1e293b;
        color: #fff;
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 13.5px;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        z-index: 99;
        max-width: 86vw;
        text-align: center;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .empty {
        text-align: center;
        color: var(--sub);
        padding: 40px 10px;
        font-size: 14px;
      }
      @media (max-width: 480px) {
        .opts.two {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast"></div>
    <script>
      /* ===================== 数据（四份复习资料，共212题） ===================== */
      /*DATA_START*/
      const PAPERS = [
        {
          name: "复习资料一",
          p1: [
            {
              q: "To tell you the ____ , I don't agree with you.",
              o: ["true", "truly", "truth", "truly"],
              a: 2,
              e: "固定句型 to tell you the truth（说实话），空格处需用名词 truth。",
            },
            {
              q: "I owe you some money. Let me pay you ____ now.",
              o: ["back", "for", "in", "to"],
              a: 0,
              e: "pay back「偿还（欠款）」。句意：我欠你钱，现在还你。pay for 是「为某物付钱」，宾语是东西而不是人。",
            },
            {
              q: "The banker will explain the terms of loan to you ____ detail.",
              o: ["on", "in", "with", "out of"],
              a: 1,
              e: "固定搭配 in detail「详细地」。",
            },
            {
              q: "The picture reminds me ____ the time we spent together in New York.",
              o: ["of", "in", "for", "to"],
              a: 0,
              e: "remind sb of sth「使某人想起某事」。",
            },
            {
              q: "I'm rather anxious ____ her, for I haven't heard from her for a long time.",
              o: ["toward", "about", "in", "over"],
              a: 1,
              e: "be anxious about「为……担忧」，后半句「很久没有她的消息」印证了担心。",
            },
            {
              q: "I suddenly realized that he was trying to ____ quarrelling with me.",
              o: ["consider", "enjoy", "avoid", "prevent"],
              a: 2,
              e: "avoid doing sth「避免做某事」，后接动名词。consider doing 虽也接 doing，但「考虑吵架」语义不通；prevent 用法是 prevent sb (from) doing。",
            },
            {
              q: "It was not a serious accident; our car needs only some ____ repairs.",
              o: ["major", "secondary", "minor", "primary"],
              a: 2,
              e: "词义辨析：前半句说「不是严重事故」→ 只需要 minor（小的）修理。major 大的；secondary 次要的；primary 首要的。",
            },
            {
              q: "Don't ____ to let me know if there is anything I can do for you.",
              o: ["reject", "prevent", "hesitate", "refuse"],
              a: 2,
              e: "hesitate to do sth「犹豫（不愿）做某事」。语境：有需要尽管开口，别犹豫。",
            },
            {
              q: "His ears are highly sensitive ____ any unusual sound in the machine.",
              o: ["of", "to", "on", "by"],
              a: 1,
              e: "be sensitive to「对……敏感」。",
            },
            {
              q: "We are looking forward to ____ to the lecture by the famous professor.",
              o: ["send", "be sent", "being sent", "sending"],
              a: 2,
              e: "look forward to 中的 to 是介词，后接动名词；「被派去听讲座」要用被动式 being sent。",
            },
            {
              q: "Only by working hard ____ succeed.",
              o: ["can you", "you can", "should you", "you should"],
              a: 0,
              e: "「Only + 状语」位于句首时句子要部分倒装：Only by working hard can you succeed（只有努力你才能成功）。B、D 语序错误。",
            },
            {
              q: "Jenny didn't have time to go to concert last night because she was busy ____ for her examination.",
              o: [
                "to prepare",
                "to be prepared",
                "preparing",
                "being prepared",
              ],
              a: 2,
              e: "be busy doing sth「忙于做某事」。",
            },
            {
              q: "If you spare half an hour each day to read an English newspaper, you will surely be able to read ____ .",
              o: ["efficiently", "sufficiently", "actually", "purposefully"],
              a: 0,
              e: "词义辨析：每天坚持读报，阅读会变得高效 → efficiently（高效地）。sufficiently 足够地；actually 实际上；purposefully 有目的地。",
            },
            {
              q: "____ you've got a chance, you might as well make full use of it.",
              o: ["Now that", "After", "In that", "As soon as"],
              a: 0,
              e: "now that「既然」：既然得到了机会，不妨充分利用。might as well「不妨」。",
            },
            {
              q: "The real trouble ____ their lack of confidence in their abilities.",
              o: ["lies in", "lies on", "results in", "leads to"],
              a: 0,
              e: "lie in「在于」：真正的麻烦在于缺乏自信。result in / lead to 都表示「导致」，后面要接结果而不是内容。",
            },
            {
              q: "You will be given a ticket if you ____ the speed limit.",
              o: ["proceed", "exceed", "succeed", "precede"],
              a: 1,
              e: "词形辨析：exceed the speed limit「超速」。proceed 继续进行；succeed 成功；precede 先于。超速会被开罚单。",
            },
            {
              q: "The movie star ____ with your sister, didn't he?",
              o: [
                "was used to dance",
                "used to dancing",
                "used to dance",
                "was used to dancing",
              ],
              a: 2,
              e: "used to do「过去常常做」；be used to doing「习惯于做」。反义疑问部分 didn't he 说明是对过去的陈述。",
            },
            {
              q: "The three hours I spent in the school library ____ my old passion for reading.",
              o: [
                "brought about",
                "brought over",
                "brought up",
                "brought back",
              ],
              a: 3,
              e: "bring back「唤回、重新唤起」旧日的阅读热情。bring about 导致；bring up 抚养/提出；bring over 带来。",
            },
            {
              q: "Mother insisted that ____ .",
              o: [
                "they are to be back before nine in the evening",
                "they ought to be back before nine in the evening",
                "they be back before nine in the evening",
                "they had to be back before nine in the evening",
              ],
              a: 2,
              e: "insist 表示「坚决要求」时，宾语从句用虚拟语气：(should +) 动词原形 → they be back。",
            },
            {
              q: "The child was ____ immediately after supper.",
              o: [
                "so tired that he went to bed",
                "enough tired to go to bed",
                "too tired to go to bed",
                "very tired, he went to bed",
              ],
              a: 0,
              e: "so...that「如此……以至于」：累得吃完晚饭立刻就上床睡了。C 项 too tired to go to bed 意为「太累而不去睡觉」，语义相反。",
            },
          ],
          cloze: {
            passage:
              'Do you forget to turn off the lights and heaters when you go out of a room? In 2040 it will not {21}. They will turn themselves off — and on again when you return. A sensor will {22} the presence of a human and turn the systems on, and when the humans {23}, it will turn them off again.\nThe sensors will work {24} the central home computer, and they will do much more than just turn the fires and lights on and off for you. They will detect {25} electrical appliances, plugs or switches, {26} them so that they cannot harm anyone and then {27} you that they need {28}. They will detect fire and if you are out of the house, the computer will call the fire brigade. It will also call the police {29} the sensors detect an intruder. This will not be too difficult {30} the locks on the {31} doors will be electronic. You will open them using your {32} card — the one you use for {33} — maybe using a number {34} only to you.\nThe computer will be {35} than a fireman-policeman servant. It will be an entertainer, and most of your {36} will come {37} into your home. It does now, {38} by 2040 "entertainment" will {39} much more. For one thing, you will be able to take {40} actively, rather than just watching...',
            qs: [
              {
                o: ["matter", "function", "work", "mind"],

        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      };

            .then(() => (DIRTY = false))

      /* ===================== 首页 ===================== */
      function daysLeft() {

      /* ===================== 组卷 ===================== */
      function buildQuiz(mode) {
        const blocks = [];
        let n = 0;
        const h = (title, sub) => blocks.push({ k: "h", title, sub });
        const addP1 = (items) => {
          h("Part I 词汇与结构", "每题1.5分 · 共20题");
          items.forEach((it) =>
            blocks.push(Object.assign({ k: "q", num: ++n }, it)),
          );

        const addClozeGroup = (g) => {
          h("Part II 完形填空", "每空1分 · 共20空");
          const map = {};
          const nums = g.qs.map((q) => {
            map[q.idx + 21] = ++n;
            return n;
          });
          blocks.push({ k: "p", pid: g.pid, passage: g.passage, map });
          g.qs.forEach((q, i) =>
            blocks.push(Object.assign({ k: "q", num: nums[i] }, q)),
          );
        };
        const addReadGroup = (g) => {
          g.qs.forEach((q) =>
            blocks.push(Object.assign({ k: "q", num: ++n }, q)),
          );
        };
        const addTrans = (items) => {
          h("Part IV 翻译（英译汉）", "每句3分 · 对照参考译文自评");
          items.forEach((it) =>
            blocks.push(Object.assign({ k: "t", num: ++n }, it)),
          );
        };

        if (mode === "wrong") {
          const ids = shuffle(Object.keys(SAVE.wrong));
          if (!ids.length) {
            toast("错题本是空的");
            return null;
          }
          const p1i = [],
            ti = [],
            cmap = {},
            rmap = {};
          ids.forEach((id) => {
            const s = id.split(":");
            const pid = +s[0],
              sec = +s[1],
              idx = +s[2];
            if (sec === 1)
              p1i.push(Object.assign({ pid, sec, idx }, PAPERS[pid].p1[idx]));
            else if (sec === 2) (cmap[pid] = cmap[pid] || []).push(idx);
            else if (sec === 3) {
              const key = pid + ":" + (idx >> 2);
              (rmap[key] = rmap[key] || {
                pid,
                ri: idx >> 2,
                idxs: [],
              }).idxs.push(idx);
            } else
              ti.push(Object.assign({ pid, sec, idx }, PAPERS[pid].trans[idx]));
          });
          if (p1i.length) addP1(p1i);
          Object.keys(cmap).forEach((pid) => {
            const idxs = cmap[pid].sort((a, b) => a - b);
            h("Part II 完形填空（错题）", "仅列出你做错的空，文章已给出");
            const map = {};
            const nums = idxs.map((ix) => {
              map[ix + 21] = ++n;
              return n;
            });
            blocks.push({
              k: "p",
              pid: +pid,
              passage: PAPERS[pid].cloze.passage,
              map,
            });
            idxs.forEach((ix, i) =>
              blocks.push(
                Object.assign(
                  { k: "q", num: nums[i] },
                  PAPERS[pid].cloze.qs[ix],
                  { pid: +pid, sec: 2, idx: ix },
                ),
              ),
            );
          });
          const rkeys = Object.keys(rmap);
          if (rkeys.length) {
            h("Part III 阅读理解（错题）", "仅列出你做错的题");
          }
          rkeys.forEach((key) => {
            const g = rmap[key];
            blocks.push({
              k: "p",
              pid: g.pid,
              passage: PAPERS[g.pid].reading[g.ri].passage,
              map: null,
              plain: true,
            });
            g.idxs
              .sort((a, b) => a - b)
              .forEach((ix) =>
                blocks.push(
                  Object.assign(
                    { k: "q", num: ++n },
                    PAPERS[g.pid].reading[g.ri].qs[ix % 4],
                    { pid: g.pid, sec: 3, idx: ix },
                  ),
                ),
              );
          });
          if (ti.length) addTrans(ti);
          return { mode, blocks };
        }
        if (mode === "mock" || mode === "p1") addP1(sample(P1POOL, 20));
        if (mode === "mock" || mode === "cloze")
          addClozeGroup(CLOZEPOOLS[(Math.random() * CLOZEPOOLS.length) | 0]);
        if (mode === "mock" || mode === "read") {
          h("Part III 阅读理解", "每题2.5分 · 共8题 / 2篇");
          sample(READGROUPS, 2).forEach(addReadGroup);
        }
        if (mode === "mock" || mode === "trans") addTrans(sample(TRPOOL, 5));
        return { mode, blocks };
      }

      /* ===================== 做题页 ===================== */
      function renderPassageHTML(b, review) {
        return b.passage.replace(/\{(\d+)\}/g, (m, ds) => {
          const old = +ds;
          const nw = b.map ? b.map[old] : null;
          if (review) {

            : '<span class="cb dim"></span>';
        });
      }
      function qCardHTML(b, review) {

          id +
          '">' +
          head +
          qt +
          '<div class="opts' +
          (two ? " two" : "") +
          '">' +
          opts +
          "</div>" +
          expl +
          "</div>"
        );
      }
      function tCardHTML(b, review) {
        const id = b.pid + ":" + b.sec + ":" + b.idx;
        const rated = QUIZ.rate[id];
        if (!review) {
          return (
            '<div class="card" id="qb-' +
            id +
            '"><div class="qhead"><span class="qnum">' +
            b.num +
            '</span><span class="src">' +
            esc(srcLabel(b)) +
            "</span></div>" +
            '<div class="qtext">' +
            esc(b.en) +
            "</div>" +
            '<textarea class="tra" data-act="tinput" data-id="' +
            id +
            '" placeholder="在此输入你的中文译文（也可在心里翻译后直接交卷对照）"></textarea></div>'
          );
        }
        const mine = QUIZ.trans[id] || "";
        return (
          '<div class="card"><div class="qhead"><span class="qnum">' +
          b.num +
          '</span><span class="src">' +
          esc(srcLabel(b)) +
          '</span><span class="badge ' +
          (rated === undefined ? "na" : rated ? "ok" : "no") +
          '">' +
          (rated === undefined ? "未自评" : rated ? "✓ 翻得好" : "✗ 待加强") +
          "</span></div>" +
          '<div class="qtext">' +
          esc(b.en) +
          "</div>" +
          '<div class="yours"><b>你的译文：</b>' +
          esc(mine || "（未填写）") +
          "</div>" +
          '<div class="ref"><b>参考译文：</b>' +
          esc(b.zh) +
          "</div>" +
          '<div class="expl">💡 ' +
          esc(b.e) +
          "</div>" +
          '<div class="ratebox"><span>自评（计入总分）：</span><button class="rbtn y' +
          (rated === true ? " on" : "") +
          '" data-act="rate" data-id="' +
          id +
          '" data-v="1">✓ 翻对了</button><button class="rbtn n' +
          (rated === false ? " on" : "") +
          '" data-act="rate" data-id="' +
          id +
          '" data-v="0">✗ 没翻好</button></div></div>'
        );
      }
      function quizTotals() {
        let tq = 0,
          tt = 0;
        QUIZ.blocks.forEach((b) => {
          if (b.k === "q") tq++;
          if (b.k === "t") tt++;
        });
        return { tq, tt, total: tq + tt };
      }
      function answeredCount() {
        let c = Object.keys(QUIZ.ans).length;
        QUIZ.blocks.forEach((b) => {
          if (
            b.k === "t" &&
            (QUIZ.trans[b.pid + ":" + b.sec + ":" + b.idx] || "").trim()
          )
            c++;
        });
        return c;
      }
      function renderQuiz() {
        const m = MODES[QUIZ.mode];
        const t = quizTotals();
        $("#app").innerHTML = `
  <div class="topbar">
    <button class="tbtn" data-act="quit">退出</button>
    <span class="t">${m.icon} ${m.name}</span>
    <span class="m"><span id="prog">0</span>/${t.total} 题 · <span id="timer">00:00</span></span>
    <button class="tbtn" data-act="card">答题卡</button>
    <button class="tbtn main" data-act="submit">交卷</button>
  </div>
  <div class="cardpanel" id="cardpanel"><h4>答题卡（点击题号跳转，绿色=已作答）</h4><div class="ngrid" id="ngrid"></div></div>
  <div id="blocks">${QUIZ.blocks
    .map((b) => {
      if (b.k === "h")
        return (
          '<div class="sech"><b>' +

      return tCardHTML(b, false);
    })
    .join("")}</div>
  <div class="rowbtns"><button class="bbtn pri" data-act="submit">交 卷</button></div>`;
        window.scrollTo(0, 0);
        startTimer();
        renderNGrid();
      }
      function renderNGrid() {
        const g = $("#ngrid");
        if (!g) return;
        g.innerHTML = QUIZ.blocks
          .filter((b) => b.k === "q" || b.k === "t")
          .map((b) => {
            const id = b.pid + ":" + b.sec + ":" + b.idx;
            const done =
              b.k === "t"
                ? (QUIZ.trans[id] || "").trim().length > 0
                : QUIZ.ans[id] !== undefined;
            return (
              '<div class="ncell' +
              (done ? " done" : "") +
              '" data-act="jump" data-id="' +
              id +
              '">' +
              b.num +
              "</div>"
            );
          })
          .join("");
      }
      function updateProgress() {
        const p = $("#prog");
        if (p) p.textContent = answeredCount();
      }

      /* 计时 */
      function startTimer() {
        stopTimer();
        QUIZ.t0 = Date.now();
        QUIZ.tick = setInterval(() => {
          const s = ((Date.now() - QUIZ.t0) / 1000) | 0;
          const el = $("#timer");
          if (el)
            el.textContent =
              String((s / 60) | 0).padStart(2, "0") +
              ":" +
              String(s % 60).padStart(2, "0");
        }, 500);
      }
      function stopTimer() {
        if (QUIZ && QUIZ.tick) {
          clearInterval(QUIZ.tick);
          QUIZ.tick = null;
        }
      }
      function usedTime() {
        const s = QUIZ.t0 ? ((Date.now() - QUIZ.t0) / 1000) | 0 : 0;
        return (
          String((s / 60) | 0).padStart(2, "0") +
          ":" +
          String(s % 60).padStart(2, "0")
        );
      }

      /* ===================== 交卷与结果 ===================== */
      function submitQuiz() {
        const t = quizTotals();
        const un = t.total - answeredCount();
        if (un > 0 && !confirm("还有 " + un + " 题未作答，确定交卷吗？"))
          return;
        stopTimer();
        QUIZ.tEnd = Date.now();
        // 更新错题本与统计
        SAVE.stats.n++;
        QUIZ.blocks.forEach((b) => {
          const id = b.pid + ":" + b.sec + ":" + b.idx;
          if (b.k === "q") {
            SAVE.stats.total++;
            const ok = QUIZ.ans[id] === b.a;
            if (ok) {
              SAVE.stats.correct++;
              delete SAVE.wrong[id];
            } else SAVE.wrong[id] = 1;
          }
        });
        persist();
        QUIZ.filter = "wrong";
        renderResults();
      }
      function sectionSummaries() {
        const arr = [];
        let cur = null;
        QUIZ.blocks.forEach((b) => {
          if (b.k === "h") {
            cur = { title: b.title, pt: 0, pc: 0, qc: 0, n: 0 };
            arr.push(cur);
            return;
          }
          if (!cur) return;
          if (b.k === "q") {
            const id = b.pid + ":" + b.sec + ":" + b.idx;
            const ok = QUIZ.ans[id] === b.a;
            cur.n++;
            if (ok) {
              cur.qc++;
              cur.pc += b.sec === 1 ? 1.5 : b.sec === 2 ? 1 : 2.5;
            }
            cur.pt += b.sec === 1 ? 1.5 : b.sec === 2 ? 1 : 2.5;
          }
          if (b.k === "t") {
            const r = QUIZ.rate[b.pid + ":" + b.sec + ":" + b.idx];
            cur.pt += 3;
            if (r) {
              cur.n++;
              cur.qc++;
              cur.pc += 3;
            }
          }
        });
        return arr;
      }
      function renderResults() {
        const mock = QUIZ.mode === "mock";
        const sums = sectionSummaries();
        const tot = sums.reduce(
          (a, s) => ({
            pc: a.pc + s.pc,
            pt: a.pt + s.pt,
            qc: a.qc + s.qc,
            n: a.n + s.n,
          }),
          { pc: 0, pt: 0, qc: 0, n: 0 },
        );
        const wrongCount = sums.reduce((a, s) => a + (s.n - s.qc), 0);
        if (wrongCount === 0) QUIZ.filter = "all";
        const showScore = mock && QUIZ.mode === "mock";
        $("#app").innerHTML = `
  <div class="topbar"><span class="t">📊 练习结果</span><span class="m">用时 ${usedTime()}</span></div>
  <div class="score">
    ${mock ? '<div class="big">' + Math.round(tot.pc * 10) / 10 + "<small> / 85 分</small></div>" : '<div class="big">' + tot.qc + "<small> / " + tot.n + " 题正确</small></div>"}
    <table class="rt"><tr><th>部分</th><th class="r">正确</th><th class="r">${mock ? "得分" : "正确率"}</th></tr>
    ${sums.map((s) => "<tr><td>" + esc(s.title.split("（")[0]) + '</td><td class="r">' + s.qc + "/" + s.n + '</td><td class="r">' + (mock ? Math.round(s.pc * 10) / 10 + "/" + Math.round(s.pt * 10) / 10 : Math.round((s.qc / Math.max(s.n, 1)) * 100) + "%") + "</td></tr>").join("")}
    </table>
    ${QUIZ.blocks.some((b) => b.k === "t") ? '<div class="hint">翻译题没有标准判分：请对照参考译文，在每句下方点击「翻对了 / 没翻好」自评，自评后会计入总分与错题本。</div>' : ""}
  </div>
  <div class="rowbtns">
    <button class="bbtn pri" data-act="again">再来一套</button>
    <button class="bbtn sec" data-act="filter">${QUIZ.filter === "wrong" ? "查看全部题目" : "只看错题"}</button>
    <button class="bbtn sec" data-act="home">回首页</button>
  </div>
  <div id="review"></div>`;
        renderReview();
        window.scrollTo(0, 0);
      }
      function renderReview() {
        const box = $("#review");
        if (!box) return;
        const fw = QUIZ.filter === "wrong";
        const parts = [];
        let buf = [];
        const flush = () => {
          if (buf.length) {
            parts.push(buf.join(""));
            buf = [];
          }
        };
        QUIZ.blocks.forEach((b) => {
          if (b.k === "h") {
            flush();
            buf.push(
              '<div class="sech"><b>' +
                esc(b.title) +
                "</b><span>" +
                esc(b.sub || "") +
                "</span></div>",
            );
            return;
          }
          if (b.k === "p") {
            const isCloze = !!b.map;
            buf.push(
              isCloze
                ? '<div class="passage">✅ 正确答案已填入文中：' +
                    renderPassageHTML(b, true) +
                    "</div>"
                : '<details class="passage"><summary>📄 点击展开/收起原文</summary>' +
                    esc(b.passage) +
                    "</details>",
            );
            return;
          }
          if (b.k === "q") {
            const id = b.pid + ":" + b.sec + ":" + b.idx;
            const ok = QUIZ.ans[id] === b.a;
            if (fw && ok) return;
            buf.push(qCardHTML(b, true));
            return;
          }
          if (b.k === "t") {
            const id = b.pid + ":" + b.sec + ":" + b.idx;
            if (fw && QUIZ.rate[id] === true) return;
            buf.push(tCardHTML(b, true));
          }
        });
        flush();
        box.innerHTML =
          parts.join("") || '<div class="empty">没有需要显示的题目 🎉</div>';
      }

      /* ===================== 事件 ===================== */
      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-act]");
        if (!el) return;
        const act = el.dataset.act;
        if (act === "start") {
          const q = buildQuiz(el.dataset.mode);
          if (q) {
            QUIZ = Object.assign(q, { ans: {}, trans: {}, rate: {} });
            renderQuiz();
          }
        } else if (act === "quit") {
          if (confirm("退出本次练习？已作答内容不会保存。")) renderHome();
        } else if (act === "home") renderHome();
        else if (act === "again") {
          const q = buildQuiz(QUIZ.mode);
          if (q) {
            QUIZ = Object.assign(q, { ans: {}, trans: {}, rate: {} });
            renderQuiz();
          } else renderHome();
        } else if (act === "opt") {
          const id = el.dataset.id,
            i = +el.dataset.i;
          QUIZ.ans[id] = i;
          document
            .querySelectorAll("#qb-" + CSS.escape(id) + " .opt")
            .forEach((o) => o.classList.remove("sel"));
          el.classList.add("sel");
          updateProgress();
          renderNGrid();
        } else if (act === "jump") {
          const t = document.getElementById("qb-" + el.dataset.id);
          if (t) {
            t.scrollIntoView({ behavior: "smooth", block: "center" });
            t.style.boxShadow = "0 0 0 3px rgba(37,99,235,.35)";
            setTimeout(() => (t.style.boxShadow = ""), 1200);
          }
        } else if (act === "card") $("#cardpanel").classList.toggle("show");
        else if (act === "submit") submitQuiz();
        else if (act === "filter") {
          QUIZ.filter = QUIZ.filter === "wrong" ? "all" : "wrong";
          const b = $('[data-act="filter"]');
          if (b)
            b.textContent =
              QUIZ.filter === "wrong" ? "查看全部题目" : "只看错题";
          renderReview();
        } else if (act === "rate") {
          const id = el.dataset.id,
            v = el.dataset.v === "1";
          QUIZ.rate[id] = v;
          if (v) {
            delete SAVE.wrong[id];
          } else SAVE.wrong[id] = 1;
          persist();
          const y = window.scrollY;
          renderResults();
          window.scrollTo(0, y);
        } else if (act === "cleardata") {
          if (confirm("确定清除全部练习记录和错题本吗？")) {
            SAVE = { wrong: {}, stats: { n: 0, correct: 0, total: 0 } };
            persist();
            renderHome();
          }
        }
      });
      document.addEventListener("input", (e) => {
        const el = e.target.closest('[data-act="tinput"]');
        if (!el) return;
        QUIZ.trans[el.dataset.id] = el.value;
        updateProgress();
        renderNGrid();
      });
      (async () => {
        await initStore();
        renderHome();
      })();
    </script>
  </body>
</html>
