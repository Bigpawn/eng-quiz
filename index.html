<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>学位英语刷题本</title>
    <style>
      :root {
        --blue: #2563eb;
        --blue-l: #eff6ff;
        --green: #16a34a;
        --green-l: #dcfce7;
        --red: #dc2626;
        --red-l: #fee2e2;
        --ink: #1e293b;
        --sub: #64748b;
        --line: #e2e8f0;
        --bg: #eef1f6;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.65 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          sans-serif;
      }
      #app {
        max-width: 780px;
        margin: 0 auto;
        padding: 0 12px 60px;
      }
      /* ---------- 首页 ---------- */
      .hero {
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: #fff;
        border-radius: 16px;
        padding: 22px 20px;
        margin: 14px 0 12px;
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
      }
      .hero h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      .hero p {
        margin: 0;
        opacity: 0.92;
        font-size: 13.5px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .chip {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12.5px;
        color: var(--sub);
      }
      .chip b {
        color: var(--ink);
      }
      .mode {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-align: left;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 15px 16px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: 0.15s;
        font: inherit;
      }
      .mode:active {
        transform: scale(0.985);
      }
      .mode:hover {
        border-color: #93c5fd;
        box-shadow: 0 3px 10px rgba(37, 99, 235, 0.08);
      }
      .mode .ic {
        font-size: 26px;
        width: 40px;
        text-align: center;
        flex: none;
      }
      .mode .tt {
        flex: 1;
      }
      .mode .tt b {
        display: block;
        font-size: 16px;
      }
      .mode .tt span {
        font-size: 12.5px;
        color: var(--sub);
      }
      .mode .arrow {
        color: #94a3b8;
        font-size: 18px;
      }
      .foot {
        color: #94a3b8;
        font-size: 12px;
        text-align: center;
        margin-top: 18px;
        line-height: 1.9;
      }
      .linkbtn {
        background: none;
        border: none;
        color: #94a3b8;
        text-decoration: underline;
        font-size: 12px;
        cursor: pointer;
        padding: 0;
      }
      /* ---------- 顶栏 ---------- */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: #fff;
        margin: 0 -12px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 2px 10px rgba(30, 41, 59, 0.15);
      }
      .topbar .t {
        font-weight: 600;
        font-size: 15px;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbar .m {
        font-size: 12px;
        opacity: 0.9;
        white-space: nowrap;
      }
      .tbtn {
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #fff;
        border-radius: 8px;
        padding: 5px 11px;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tbtn.main {
        background: #fff;
        color: var(--blue);
        border-color: #fff;
        font-weight: 600;
      }
      /* ---------- 卡片与题目 ---------- */
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 14px 15px;
        margin: 12px 0;
      }
      .sech {
        margin: 22px 0 4px;
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .sech b {
        font-size: 16.5px;
      }
      .sech span {
        font-size: 12.5px;
        color: var(--sub);
      }
      .qhead {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .qnum {
        background: var(--blue);
        color: #fff;
        border-radius: 7px;
        min-width: 30px;
        text-align: center;
        font-weight: 700;
        font-size: 13px;
        padding: 1px 6px;
      }
      .src {
        font-size: 11.5px;
        color: #94a3b8;
      }
      .badge {
        font-size: 11.5px;
        border-radius: 999px;
        padding: 2px 9px;
        margin-left: auto;
        font-weight: 600;
      }
      .badge.ok {
        background: var(--green-l);
        color: #15803d;
      }
      .badge.no {
        background: var(--red-l);
        color: #b91c1c;
      }
      .badge.na {
        background: #e5e7eb;
        color: #6b7280;
      }
      .qtext {
        margin: 2px 0 10px;
        font-size: 15.5px;
      }
      .opts {
        display: grid;
        gap: 8px;
      }
      .opts.two {
        grid-template-columns: 1fr 1fr;
      }
      .opt {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        align-items: flex-start;
        text-align: left;
        background: #fff;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 9px 11px;
        cursor: pointer;
        font: inherit;
        color: inherit;
        transition: 0.12s;
        line-height: 1.5;
      }
      .opt .note {
        flex-basis: 100%;
        font-size: 12px;
        color: #64748b;
        line-height: 1.55;
        padding-left: 31px;
        margin-top: 2px;
      }
      .opt i {
        font-style: normal;
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1.5px solid #cbd5e1;
        color: var(--sub);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 1px;
      }
      .opt.sel {
        border-color: var(--blue);
        background: var(--blue-l);
      }
      .opt.sel i {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .opt.right {
        border-color: var(--green);
        background: var(--green-l);
      }
      .opt.right i {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .opt.wrongpick {
        border-color: var(--red);
        background: var(--red-l);
      }
      .opt.wrongpick i {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }
      .opt .tag {
        font-size: 11px;
        color: var(--sub);
        margin-left: auto;
        flex: none;
        padding-left: 6px;
      }
      /* ---------- 文章 ---------- */
      .passage {
        background: #fbfaf6;
        border: 1px solid #ece7d8;
        border-radius: 13px;
        padding: 15px 16px;
        margin: 12px 0;
        font-size: 15px;
        line-height: 1.9;
        white-space: pre-wrap;
      }
      details.passage {
        cursor: pointer;
      }
      details.passage summary {
        font-weight: 600;
        color: var(--blue);
        font-size: 13.5px;
        margin-bottom: 6px;
        cursor: pointer;
        list-style-position: inside;
      }
      .cb {
        display: inline-block;
        min-width: 1.7em;
        text-align: center;
        border: 1.5px dashed #94a3b8;
        border-radius: 6px;
        padding: 0 5px;
        margin: 0 2px;
        color: var(--blue);
        font-weight: 700;
        font-size: 12.5px;
        background: var(--blue-l);
        vertical-align: 1px;
      }
      .cb.dim {
        color: #cbd5e1;
        background: #f6f7f9;
        border-color: #e2e8f0;
      }
      .fill {
        color: #15803d;
        font-weight: 700;
        border-bottom: 2px solid #86efac;
        padding: 0 2px;
      }
      .ub {
        display: inline-block;
        min-width: 72px;
        border-bottom: 1.5px solid #b6c2d4;
        height: 0.95em;
        vertical-align: baseline;
      }
      /* ---------- 解析与翻译 ---------- */
      .trbox {
        background: #f8fafc;
        border: 1px dashed var(--line);
        border-radius: 9px;
        padding: 8px 11px;
        font-size: 13.5px;
        margin: 0 0 10px;
        color: #334155;
      }
      .expl {
        background: #f0f7ff;
        border-left: 3px solid var(--blue);
        border-radius: 0 8px 8px 0;
        padding: 9px 12px;
        font-size: 13.5px;
        margin-top: 10px;
        color: #334155;
      }
      .expl.g {
        background: #f0fdf4;
        border-left-color: var(--green);
      }
      .yours,
      .ref {
        font-size: 14px;
        margin-top: 8px;
        padding: 8px 11px;
        border-radius: 9px;
      }
      .yours {
        background: #f8fafc;
        border: 1px dashed var(--line);
        white-space: pre-wrap;
      }
      .ref {
        background: var(--green-l);
        white-space: pre-wrap;
      }
      .ref b,
      .yours b {
        font-weight: 600;
      }
      .ratebox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .ratebox span {
        font-size: 13px;
        color: var(--sub);
      }
      .rbtn {
        border: 1.5px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 5px 14px;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      .rbtn.on.y {
        background: var(--green-l);
        border-color: var(--green);
        color: #15803d;
        font-weight: 600;
      }
      .rbtn.on.n {
        background: var(--red-l);
        border-color: var(--red);
        color: #b91c1c;
        font-weight: 600;
      }
      textarea.tra {
        width: 100%;
        min-height: 70px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 9px 11px;
        font: inherit;
        resize: vertical;
        background: #fff;
      }
      textarea.tra:focus {
        outline: none;
        border-color: var(--blue);
      }
      /* ---------- 答题卡 ---------- */
      .cardpanel {
        position: sticky;
        top: 52px;
        z-index: 15;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 12px;
        margin: 10px 0;
        display: none;
      }
      .cardpanel.show {
        display: block;
      }
      .cardpanel h4 {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--sub);
      }
      .ngrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
        gap: 6px;
      }
      .ncell {
        border: 1.5px solid var(--line);
        border-radius: 8px;
        background: #fff;
        height: 34px;
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ncell.done {
        background: var(--blue-l);
        border-color: #93c5fd;
        color: var(--blue);
      }
      /* ---------- 成绩 ---------- */
      .score {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        margin: 14px 0;
      }
      .score .big {
        font-size: 40px;
        font-weight: 800;
        color: var(--blue);
        line-height: 1.1;
      }
      .score .big small {
        font-size: 16px;
        color: var(--sub);
        font-weight: 500;
      }
      table.rt {
        width: 100%;
        border-collapse: collapse;
        margin-top: 14px;
        font-size: 14px;
      }
      table.rt td,
      table.rt th {
        padding: 7px 4px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      table.rt td.r,
      table.rt th.r {
        text-align: right;
      }
      table.rt th {
        color: var(--sub);
        font-weight: 500;
        font-size: 12.5px;
      }
      .hint {
        font-size: 12.5px;
        color: #b45309;
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 9px;
        padding: 7px 11px;
        margin-top: 12px;
      }
      .rowbtns {
        display: flex;
        gap: 9px;
        margin: 14px 0;
        flex-wrap: wrap;
      }
      .bbtn {
        flex: 1;
        min-width: 120px;
        border: none;
        border-radius: 11px;
        padding: 11px;
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .bbtn.pri {
        background: var(--blue);
        color: #fff;
      }
      .bbtn.sec {
        background: #fff;
        border: 1.5px solid var(--line);
        color: var(--ink);
      }
      .bbtn.warn {
        background: #fff;
        border: 1.5px solid #fecaca;
        color: #b91c1c;
      }
      /* ---------- 其它 ---------- */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 36px;
        transform: translateX(-50%) translateY(20px);
        background: #1e293b;
        color: #fff;
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 13.5px;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        z-index: 99;
        max-width: 86vw;
        text-align: center;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .empty {
        text-align: center;
        color: var(--sub);
        padding: 40px 10px;
        font-size: 14px;
      }
      @media (max-width: 480px) {
        .opts.two {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast"></div>
    <script>
      /* ===================== 数据（四份复习资料，共212题） ===================== */
      /*DATA_START*/
const PAPERS=[
{name:"复习资料一",
p1:[
{q:"To tell you the ____ , I don't agree with you.",o:["true","truly","truth","truly"],a:2,cn:"老实说，我不同意你的看法。",ops:["true 是形容词「真的」，此处需要名词","truly 是副词「真正地」，词性不符","✓ truth 名词；固定句型 to tell you the truth「说实话」","同 B，副词，排除"],g:"agree with sb「同意（某人的看法）」；对比：agree to sth 同意某事、agree on 就…达成一致。",e:"固定句型 to tell you the truth（说实话），空格处需用名词 truth。"},
{q:"I owe you some money. Let me pay you ____ now.",o:["back","for","in","to"],a:0,cn:"我欠你一些钱，现在让我还你。",ops:["✓ pay back「偿还」，pay you back＝把钱还给你","pay for 后接买到的东西（pay for the book），不接人","pay in「存入（款项）」，语境不合","pay to 单独不构成固定搭配（pay sth to sb 需带宾语）"],g:"owe sb sth＝owe sth to sb「欠某人某物」；Let me... 祈使句表建议。",e:"pay back「偿还（欠款）」：我欠你钱，现在还你。"},
{q:"The banker will explain the terms of loan to you ____ detail.",o:["on","in","with","out of"],a:1,cn:"银行职员会向你详细解释贷款条款。",ops:["on 无此搭配","✓ in detail 固定搭配「详细地」","with 无此搭配","out of 无此搭配"],g:"explain sth to sb「向某人解释某事」，to 不可省；the terms of loan 贷款条款。",e:"固定搭配 in detail「详细地」。"},
{q:"The picture reminds me ____ the time we spent together in New York.",o:["of","in","for","to"],a:0,cn:"这张照片让我想起我们一起在纽约度过的时光。",ops:["✓ remind sb of sth「使某人想起某事」","in 无此搭配","for 无此搭配","to 无此搭配"],g:"we spent together... 是省略 that/which 的定语从句，修饰 the time；spend...（in）doing 花时间做。",e:"remind sb of sth「使某人想起某事」。"},
{q:"I'm rather anxious ____ her, for I haven't heard from her for a long time.",o:["toward","about","in","over"],a:1,cn:"我相当担心她，因为我很久没有她的消息了。",ops:["toward 多用于 attitude toward（对…的态度）","✓ be anxious about「为…担忧」","in 无此搭配","over 无此搭配"],g:"hear from sb「收到某人的来信/消息」；rather「相当」，修饰形容词。",e:"be anxious about「为……担忧」，后半句「很久没有她的消息」印证了担心。"},
{q:"I suddenly realized that he was trying to ____ quarrelling with me.",o:["consider","enjoy","avoid","prevent"],a:2,cn:"我突然意识到他是想避免和我争吵。",ops:["consider 后虽可接 doing，但「考虑吵架」语义不通","enjoy doing「喜欢做」，语义不合","✓ avoid doing sth「避免做某事」","prevent 的用法是 prevent sb (from) doing，不直接接 doing"],g:"quarrel with sb「与某人争吵」；that 从句作 realized 的宾语。",e:"avoid doing sth「避免做某事」。"},
{q:"It was not a serious accident; our car needs only some ____ repairs.",o:["major","secondary","minor","primary"],a:2,cn:"那不是一起严重的事故，我们的车只需要小修一下。",ops:["major「大的、主要的」，与 not serious 矛盾","secondary「次要的」，不与 repairs 搭配表「小修」","✓ minor「小的、轻微的」，minor repairs 小修","primary「首要的」，语义不合"],g:"分号连接两个并列分句；need 作实义动词「需要」。",e:"前半句「不是严重事故」→ 只需 minor（小的）repairs。"},
{q:"Don't ____ to let me know if there is anything I can do for you.",o:["reject","prevent","hesitate","refuse"],a:2,cn:"如果有什么我能帮上忙的，请别犹豫尽管告诉我。",ops:["reject 及物动词「拒绝（某物）」，不接 to do","prevent 及物动词「阻止」，用法 prevent sb from doing","✓ hesitate to do sth「犹豫（不愿）做某事」","refuse to do 语法正确，但意为「拒绝告知」，与语境相反"],g:"if 从句中有 anything，用于疑问/否定语境。",e:"hesitate to do sth「别犹豫」。"},
{q:"His ears are highly sensitive ____ any unusual sound in the machine.",o:["of","to","on","by"],a:1,cn:"他的耳朵对机器里任何异常的声音都极为敏感。",ops:["of 无此搭配","✓ be sensitive to「对…敏感」","on 无此搭配","by 无此搭配"],g:"highly 修饰形容词 sensitive；unusual＝un+usual「异常的」。",e:"be sensitive to「对……敏感」。"},
{q:"We are looking forward to ____ to the lecture by the famous professor.",o:["send","be sent","being sent","sending"],a:2,cn:"我们都盼着被派去听那位著名教授的讲座。",ops:["send 动词原形；look forward to 的 to 是介词，后须接动名词","be sent 不定式，词性不符","✓ being sent 动名词被动式：「被派去」","sending 主动式；「我们被派」应为被动"],g:"look forward to 中 to 为介词，后接 doing；by the famous professor 表被动执行者。",e:"短语 look forward to 中 to 是介词，接动名词；「被派去听讲座」用被动 being sent。"},
{q:"Only by working hard ____ succeed.",o:["can you","you can","should you","you should"],a:0,cn:"只有努力，你才能成功。",ops:["✓ Only+状语位于句首 → 部分倒装：can you succeed","语序未倒装，错误","倒装形式正确，但 should「应该」与句意「能够成功」不符","无倒装且情态不当"],g:"by + doing「通过…方式」；「Only + 状语」置句首必须部分倒装（情态动词/助动词提前）。",e:"「Only + 状语」位于句首引起部分倒装：Only by working hard can you succeed。"},
{q:"Jenny didn't have time to go to concert last night because she was busy ____ for her examination.",o:["to prepare","to be prepared","preparing","being prepared"],a:2,cn:"珍妮昨晚没时间去听音乐会，因为她忙着备考。",ops:["be busy 不接 to do","被动式无依据，且 busy 后不接不定式","✓ be busy doing sth「忙于做某事」","being prepared 进行被动式，错误"],g:"have time to do sth「有时间做某事」；because 引导原因状语从句。",e:"be busy doing sth「忙于做某事」。"},
{q:"If you spare half an hour each day to read an English newspaper, you will surely be able to read ____ .",o:["efficiently","sufficiently","actually","purposefully"],a:0,cn:"如果每天抽半小时读英文报纸，你的阅读一定会变得高效。",ops:["✓ efficiently「高效地」，每天坚持读报→阅读高效","sufficiently「足够地」","actually「实际上」","purposefully「有目的地」"],g:"be able to do「能够做」；spare「抽出（时间）」。",e:"每天坚持读报 → 阅读变得高效 efficiently。"},
{q:"____ you've got a chance, you might as well make full use of it.",o:["Now that","After","In that","As soon as"],a:0,cn:"既然你得到了机会，不妨充分利用它。",ops:["✓ now that「既然」，引出已知条件","After「在…之后」，时间义不合","In that「因为、在于」，书面语且此处不通","As soon as「一…就…」，时间义不合"],g:"might as well「不妨」；make full use of「充分利用」。",e:"now that「既然」：既然有机会，不妨充分利用。"},
{q:"The real trouble ____ their lack of confidence in their abilities.",o:["lies in","lies on","results in","leads to"],a:0,cn:"真正的麻烦在于他们缺乏对自己能力的信心。",ops:["✓ lie in「在于」","lies on 无此搭配","results in「导致」，后接结果；此处 lack 是内容不是结果","leads to「导致」，同 C"],g:"lack of confidence「缺乏信心」；lack 也可作动词：lack confidence。",e:"lie in「在于」：真正的麻烦在于缺乏自信。result in / lead to 都表示「导致」。"},
{q:"You will be given a ticket if you ____ the speed limit.",o:["proceed","exceed","succeed","precede"],a:1,cn:"如果你超速，就会被开罚单。",ops:["proceed「继续进行」","✓ exceed the speed limit「超速」","succeed「成功」，形近干扰","precede「先于」，形近干扰"],g:"will be given 一般将来时被动；ticket 此处指「罚单」。",e:"词形辨析：exceed「超过（限度）」→ 超速被开罚单。"},
{q:"The movie star ____ with your sister, didn't he?",o:["was used to dance","used to dancing","used to dance","was used to dancing"],a:2,cn:"那位影星过去常和你姐姐跳舞，不是吗？",ops:["was used to dance 结构混乱（be used to do＝被用来做）","used to dancing 缺 be 动词","✓ used to do「过去常常做」","was used to dancing「习惯于跳舞」，非「过去常做」"],g:"反义疑问 didn't he 表明前句是过去时的实义动词。",e:"used to do「过去常常做」；be used to doing「习惯于做」。反义疑问部分 didn't he 说明是对过去的陈述。"},
{q:"The three hours I spent in the school library ____ my old passion for reading.",o:["brought about","brought over","brought up","brought back"],a:3,cn:"我在学校图书馆度过的那三个小时，唤回了我对阅读的旧日热情。",ops:["brought about「导致、引起」","brought over「带来（从别处）」","brought up「抚养；提出」","✓ brought back「唤回、重新唤起」"],g:"The three hours (that) I spent... 定语从句省略 that；passion for「对…的热情」。",e:"bring back「唤回」旧日的阅读热情。"},
{q:"Mother insisted that ____ .",o:["they are to be back before nine in the evening","they ought to be back before nine in the evening","they be back before nine in the evening","they had to be back before nine in the evening"],a:2,cn:"母亲坚持要求他们晚上九点前必须回家。",ops:["are to be 现在时陈述语气，虚拟须用原形","ought to be 情态陈述，非虚拟","✓ (should+) be 虚拟语气动词原形","had to be 陈述语气「不得不」"],g:"insist 表「坚决要求」→ 宾语从句虚拟；insist 表「坚持说（事实）」→ 用陈述语气。",e:"insist 表示「坚决要求」时，宾语从句用虚拟语气：(should +) 动词原形。"},
{q:"The child was ____ immediately after supper.",o:["so tired that he went to bed","enough tired to go to bed","too tired to go to bed","very tired, he went to bed"],a:0,cn:"孩子吃完晚饭后累得立刻就上床睡觉了。",ops:["✓ so...that「如此…以至于」，that 从句表结果","enough 位置错误：应为 tired enough to","too...to「太…而不能去睡」，语义相反","两个谓语之间无连词，句法错误"],g:"immediately after「紧接…之后」。",e:"so...that「如此……以至于」：累得直接去睡觉了。C 项 too tired to 意为「太累而不去睡觉」，语义相反。"}
],
cloze:{passage:"Do you forget to turn off the lights and heaters when you go out of a room? In 2040 it will not {21}. They will turn themselves off — and on again when you return. A sensor will {22} the presence of a human and turn the systems on, and when the humans {23}, it will turn them off again.\nThe sensors will work {24} the central home computer, and they will do much more than just turn the fires and lights on and off for you. They will detect {25} electrical appliances, plugs or switches, {26} them so that they cannot harm anyone and then {27} you that they need {28}. They will detect fire and if you are out of the house, the computer will call the fire brigade. It will also call the police {29} the sensors detect an intruder. This will not be too difficult {30} the locks on the {31} doors will be electronic. You will open them using your {32} card — the one you use for {33} — maybe using a number {34} only to you.\nThe computer will be {35} than a fireman-policeman servant. It will be an entertainer, and most of your {36} will come {37} into your home. It does now, {38} by 2040 \"entertainment\" will {39} much more. For one thing, you will be able to take {40} actively, rather than just watching...",
qs:[
{o:["matter","function","work","mind"],a:0,cn:"到2040年这就不要紧了——它们（灯和暖气）会自己关闭，你回来时再自动打开。",ops:["✓ not matter「不要紧、没关系」","function「功能；运转」，语义不合","work「起作用」；not work＝失灵，与后文自动开关矛盾","mind「介意」，主语通常是人"],g:"turn themselves off 反身代词作同位语「它们自己」。",e:"not matter「不要紧」：忘了关灯也不要紧，它们会自己关。"},
{o:["evaluate","uncover","detect","expose"],a:2,cn:"传感器会探测到人的存在并打开系统。",ops:["evaluate「评估」","uncover「揭露」","✓ detect「探测」（下文多次复现）","expose「暴露」"],g:"the presence of a human「人的存在」。",e:"传感器「探测」人的存在用 detect，下文多次出现 detect。"},
{o:["retire","leave","withdraw","retreat"],a:1,cn:"当人离开时，它再把系统关闭。",ops:["retire「退休」","✓ leave「离开」","withdraw「撤回、退出」","retreat「撤退」"],g:"them 指代前文的 the systems。",e:"人「离开」时系统自动关闭。"},
{o:["during","in","through","between"],a:2,cn:"传感器通过中央家庭电脑运作，它们能做的不只是替你开关炉火和灯。",ops:["during 是介词但语义不合","in 无此搭配","✓ through「通过」","between「在…之间」，语义不合"],g:"much more than「远不止」。",e:"work through「通过…来运作」。"},
{o:["displeasing","unpleasant","faulty","mistaken"],a:2,cn:"它们会探测出有故障的电器、插头或开关。",ops:["displeasing「令人不快的」，多形容人","unpleasant「不愉快的」","✓ faulty「有故障的」，与后文「需要维修」呼应","mistaken「弄错的」"],g:"so that 引导目的状语从句。",e:"faulty「有故障的」，与后文 need repair 呼应。"},
{o:["depart","isolate","divide","break"],a:1,cn:"把它们隔离开，使它们无法伤害任何人。",ops:["depart「离开」，不及物","✓ isolate「隔离」","divide「划分」","break「打破」"],g:"harm 及物动词「伤害」。",e:"isolate「隔离」以免伤人。"},
{o:["warn","tell","persuade","assure"],a:0,cn:"然后提醒你它们需要维修。",ops:["✓ warn「提醒、警告」，可接 that 从句，贴合安全语境","tell「告诉」，无警示义，语境强调安全","persuade「说服」","assure「保证」"],g:"need + 名词（repair）。",e:"warn you that...「提醒/警告你」。"},
{o:["mend","reference","separation","repair"],a:3,cn:"（同上句）它们需要修理。",ops:["mend「修补」，多指衣物、小物件","reference「参考」","separation「分离」","✓ repair 名词「维修」，与电器搭配"],g:"（与27空同句）",e:"need repair「需要修理」。"},
{o:["will","should","shall","can"],a:1,cn:"万一传感器探测到闯入者，它（电脑）还会报警。",ops:["will 不能用于省略 if 的倒装条件句","✓ should...＝if...should「万一」，正式用法","shall 不用于此结构","can 无此用法"],g:"call the police「报警」。",e:"should the sensors detect...＝ if the sensors detect...（省略 if 的条件倒装）。"},
{o:["unless","if","when","because"],a:3,cn:"这不会太难，因为外面的门锁将是电子锁。",ops:["unless「除非」","if「如果」，前句是判断而非条件","when「当…时」","✓ because「因为」，后文解释原因"],g:"too difficult 中 too「太」。",e:"前后是因果关系：门锁是电子的，所以不难。"},
{o:["inside","outside","outstanding","obvious"],a:1,cn:"你将用你的个人卡打开外门。",ops:["inside「里面的」，逻辑相反","✓ outside「外面的」，用卡开的自然是外门","outstanding「杰出的」，形近干扰","obvious「明显的」，形近干扰"],g:"using... 现在分词作方式状语。",e:"outside doors「外门」。"},
{o:["personal","personnel","particular","general"],a:0,cn:"——就是那张你购物时用的卡。",ops:["✓ personal「个人的」，personal card 个人卡","personnel「人事；员工」，名词形近干扰","particular「特定的」","general「通用的」"],g:"破折号引出同位语 the one...。",e:"personal card「个人卡」；personnel 是名词，形近干扰。"},
{o:["hiring","buying","renewing","shopping"],a:3,cn:"（同上句）就是购物时用的那张卡。",ops:["hiring「雇用」","buying「购买」（buy sth 而非 for）","renewing「续期」","✓ shopping「购物」，use ... for shopping"],g:"（与32空同句）",e:"购物用卡：use the card for shopping。"},
{o:["realized","adapted","known","informed"],a:2,cn:"也许还要用一组只有你才知道的号码。",ops:["realized「意识到」","adapted「适应」","✓ known「已知的」，be known to sb 为某人所知，过去分词作后置定语","informed「已被告知的」（be informed of）"],g:"only to you 介词短语作状语。",e:"a number known only to you「只有你知道的号码」。"},
{o:["more","much","many","fewer"],a:0,cn:"这台电脑将不只是「消防员加警察」式的仆人。",ops:["✓ more...than「比…更」，后文有 than","much 不与 than 构成比较级","many 修饰可数复数","fewer「更少的」，语义不合"],g:"servant 名词「仆人」。",e:"句中有 than，用比较级 more...than。"},
{o:["achievements","announcements","improvement","entertainment"],a:3,cn:"它还将是个娱乐提供者，你大部分的娱乐会直接进入家门。",ops:["achievements「成就」","announcements「公告」","improvement「改善」，词义与单复数均不符","✓ entertainment「娱乐」，呼应上句 entertainer"],g:"most of + 名词「大多数」。",e:"上句说它是 entertainer → 大部分 entertainment 将进入你家。"},
{o:["only","right","correctly","fast"],a:1,cn:"（同上句）娱乐会直接进入你家。",ops:["only「仅仅」","✓ right（副词）「直接、正好」","correctly「正确地」","fast「快速地」"],g:"right 作副词修饰 into。",e:"come right into「直接进入」，right 强调「直接」。"},
{o:["but","or","other","then"],a:0,cn:"现在也是如此，但到2040年，「娱乐」的含义会更多。",ops:["✓ but 转折","or「或者」","other 是形容词，不能单独作连词","then「然后」"],g:"by + 时间「到…之前」，常与完成/将来连用。",e:"前后转折：现在也如此，但到2040年含义更多。"},
{o:["intend","understand","mean","program"],a:2,cn:"（同上句）「娱乐」将意味着更多。",ops:["intend「打算」","understand「理解」","✓ mean「意味着」","program「编程」"],g:"（与38空同句）",e:"mean much more「意味着更多」。"},
{o:["part","place","step","time"],a:0,cn:"一方面，你可以主动参与，而不是只当观众。",ops:["✓ take part (in)「参加」","take place「发生」，语义不合","take steps「采取措施」，搭配此处不通","take time「花时间」"],g:"rather than + doing「而不是」。",e:"take part actively「主动参与」，与 rather than just watching 相对。"}
]},
reading:[
{passage:"I don't often lose things and I'm especially careful with money, so I was quite surprised when I reached for my wallet and it wasn't there. At first, I thought it was possible that I could have left it at home. Then I remembered taking it out to pay the taxi, so I knew I had it with me just before I walked into the restaurant. I wondered if it was possible that it could have slipped out of my pocket while I was eating dinner. Thinking about the possibility, I turned and walked back to the table where I had been sitting. Unfortunately, there were several people sitting at the table at that time, so I had the waiter go over to the table to see if my wallet was on the floor. While the waiter was looking for it, the manager of the restaurant came up to me and asked me if anything was wrong. I didn't want to get a lot of people involved in the problem, but I knew I had to get the wallet back. I told the manager what had happened. He had me describe the wallet to him, and then he insisted that I report the missing wallet to the police. I told him that I had an appointment with my doctor in just a few minutes. I explained to him that my biggest worry at the moment was how I was going to pay the check. He told me not to worry about that. He asked me to write down my name and address, and he said he would send me a bill.",
qs:[
{q:"According to the passage, we know the writer ____ .",o:["seldom loses things","very often loses things","loses things once in a while","never loses things"],a:0,cn:"根据文章，我们知道作者____。",ops:["✓ seldom「很少」＝首句 don't often lose things","very often「经常」，与首句相反","once in a while「偶尔」，程度不符且原文强调很少","never「从不」，过于绝对"],e:"首句 I don't often lose things（我不常丢东西）＝ seldom loses things。"},
{q:"That day the writer found ____ .",o:["he had lost his wallet","he had left his wallet at home","his wallet was stolen by a thief","his wallet was lying under the table"],a:0,cn:"那天作者发现____。",ops:["✓ 伸手拿钱包发现不在→钱包丢了","落在家里——后文证实钱包随身带着","被小偷偷走——文中无偷窃证据","在桌子下——并没有找到"],e:"钱包不在身上 → 发现丢了；B/C/D 均与原文矛盾。"},
{q:"Why was the writer so sure he had brought his wallet with him?",o:["He remembered not having left it at home.","He believed his own memory.","He always felt his pocket for the wallet before he left home.","He had taken it out to pay his taxi-driver."],a:3,cn:"作者为什么确信钱包带在身上？",ops:["记得没落家里——原文先怀疑落家后被否定","相信自己的记忆——非原文依据","出门前总摸口袋确认——未提及","✓ 付出租车费时掏出过钱包"],e:"原文 remembered taking it out to pay the taxi：付车费时还掏出过钱包。"},
{q:"According to the passage, the writer most probably lost his wallet when ____ .",o:["he took it out to pay his taxi","he walked into the restaurant","he was eating dinner","he was ordering his dish"],a:2,cn:"根据文章，作者最可能是在____时丢的钱包。",ops:["付出租车费时——那时钱包还在手里","走进餐厅时——与后文线索不符","✓ 吃晚饭时（slip out while eating dinner）","点菜时——未提及"],e:"原文 wondered if it could have slipped out of my pocket while I was eating dinner。"}
]},
{passage:"Playing video games can be a fun way to unwind or spend time with friends. In schools, teachers use games like Minecraft to encourage teamwork and critical thinking. But for some players, gaming has become an unhealthy habit. Late at night, they are glued to a screen. Schoolwork suffers. The video-game world seems a friendlier place than the real one.\nMental health experts have taken notice. In June, the World Health Organization (WHO) added gaming disorder to its list of diseases and health conditions. A person may have the disorder if gaming has damaged his or her relationships with family and friends, and if it has affected his or her daily activities.\nNot all experts agree that excessive gaming should be called a disorder. They say people hooked on video games may be suffering from other mental health problems that should be treated first. Others think WHO made the right call. Psychiatrist Clifford Sussman treats gaming addiction. He says kids often have feelings of anxiety and loneliness. They get angry when a parent asks them to stop playing video games.\nWhat makes video games addictive? Playing excites the brain's reward center. After a while, the brain becomes numb to pleasure. You feel bored without a controller in your hand. So you play even more. One key to healthy gaming is to track how long you play. Sussman recommends taking at least an hour-long break after every hour of play. That gives the brain time to recover.",
qs:[
{q:"Which of the following is the best title for the passage?",o:["Mental Health Problems","Excessive Gaming","Unhealthy Habits","Teamwork Training"],a:1,cn:"以下哪项是本文的最佳标题？",ops:["心理健康问题——范围过大","✓ 过度游戏（全文核心 gaming disorder）","不健康的习惯——过于宽泛","团队训练——仅首段细节"],e:"主旨题：全文围绕游戏成瘾展开，B 项最能概括。"},
{q:"The word 'unwind' in Paragraph 1 is closest in meaning to ____ .",o:["match","meet","retreat","relax"],a:3,cn:"第一段中的 unwind 与____意思最接近。",ops:["match「匹配」","meet「见面」","retreat「撤退」","✓ relax「放松」"],e:"首句说打游戏是放松、消遣的方式 → unwind＝relax。"},
{q:"Clifford Sussman's attitude to WHO's recognition of excessive gaming as a disorder is ____ .",o:["supportive","doubtful","neutral","critical"],a:0,cn:"Sussman 对 WHO 将过度游戏认定为疾病的态度是____。",ops:["✓ supportive「支持」——认同 WHO 的判断并治疗游戏成瘾","doubtful「怀疑」","neutral「中立」","critical「批评」"],e:"态度题：Others think WHO made the right call，随后介绍的 Sussman 治疗成瘾并分析成因，属支持一方。"},
{q:"Sussman advises game players to ____ .",o:["quit playing video games","play sports instead of video games","go to the hospital to get medical treatment","rest for at least an hour after every hour of play"],a:3,cn:"Sussman 建议游戏玩家____。",ops:["戒掉游戏——建议过度","改玩运动——未提及","去医院治疗——曲解文意","✓ 每玩1小时至少休息1小时"],e:"细节题：recommends taking at least an hour-long break after every hour of play。"}
]}
],

{en:"It is well-known that the potential of the human brain is limitless.",zh:"众所周知，人脑的潜力是无限的。",e:"It is well-known that...「众所周知……」，that 从句是真正主语；potential 潜力；limitless 无限的。"},

p1:[
{q:"We believe our football players will try ____ best to win the game.",o:["them","they","their","themselves"],a:2,cn:"我们相信我们的足球运动员会尽全力赢得比赛。",ops:["them 宾格，不能修饰名词","they 主格，不可作定语","✓ their：try one's best 中 one's 与主语对应","themselves 反身代词，不作定语"],g:"win the game 赢得比赛；believe 后接省略 that 的宾语从句。",e:"try one's best「尽某人最大努力」，one's 与 our football players 对应 → their。"},
{q:"No one doubts ____ he is the best leader in the company.",o:["whether","if","what","that"],a:3,cn:"没有人怀疑他是公司最好的领导。",ops:["whether 用于肯定句 doubt 之后","if 同 whether，且此处为否定句","what 引导从句须在从句中作成分，此处不缺","✓ doubt 用于否定句时后接 that"],g:"the best 最高级；in the company 范围状语。",e:"doubt 用于否定句（No one doubts）时接 that；肯定句才用 whether/if。"},
{q:"The banker will explain the terms of loan to you ____ detail.",o:["on","in","with","out of"],a:1,cn:"银行职员会向你详细解释贷款条款。",ops:["on 无此搭配","✓ in detail 固定搭配「详细地」","with 无此搭配","out of 无此搭配"],g:"⚠ 此题与资料一第3题完全相同——高频重复题，务必秒选。",e:"in detail「详细地」。（重复题：与资料一第3题相同）"},
{q:"Talking to foreigners is fun if you ____ the right time and place.",o:["locate","consider","choose","decide"],a:2,cn:"如果选对了时间和场合，和外国人交谈是件有趣的事。",ops:["locate「定位、找出地点」","consider「考虑」","✓ choose「选择」","decide「决定」，常接 to do"],g:"动名词短语 Talking to foreigners 作主语，谓语用单数 is。",e:"选对时间和场合 → choose the right time and place。"},
{q:"To be ____ is to state or express things in an open and honest way.",o:["frank","guilty","smart","upset"],a:0,cn:"坦率，就是以公开、诚实的方式陈述或表达事情。",ops:["✓ frank「坦率的」，与 open and honest 呼应","guilty「有罪的、内疚的」","smart「聪明的」","upset「难过的」"],g:"不定式 To be... 作主语；定义句式 A is to B。",e:"空格后的解释 open and honest → frank「坦率的」。"},
{q:"Jane ____ French very fluently though she was born and grew up in Australia.",o:["talks","says","speaks","tells"],a:2,cn:"虽然 Jane 出生并成长在澳大利亚，但她的法语说得很流利。",ops:["talks「谈话」，不及物，不直接接语言","says「说」，后接具体内容","✓ speaks「说（某种语言）」","tells「告诉」"],g:"though 引导让步状语从句；fluently 副词修饰动词。",e:"「说某种语言」用 speak。"},
{q:"Hurry up! We have ____ to spare.",o:["a little time","a few time","few time","little time"],a:3,cn:"快点！我们几乎没时间了。",ops:["a little time「还有一些时间」，与 Hurry up! 矛盾","a few time：time 不可数，不能用 a few","few time：few 只修饰可数名词","✓ little time「几乎没有时间」"],g:"to spare 作后置定语「剩余的」。",e:"time 不可数排除 few 类；Hurry up! 说明「几乎没有」→ little time。"},
{q:"It's time ____ ready for work.",o:["getting","to get","get","got"],a:1,cn:"该准备上班了。",ops:["getting 无此结构","✓ It's time to do sth「该做某事了」","get 缺 to（虚拟式应为 It's time we got ready）","got 时态形式错误"],g:"对比虚拟式：It's (high) time that we got ready（从句用过去式）。",e:"It's time to do sth「该做某事了」。"},
{q:"For both sides' ____ , the contract placed clear obligations on this cooperation.",o:["beneficent","beneficial","benefit","benefactors"],a:2,cn:"为了双方的利益，合同对这项合作规定了明确的义务。",ops:["beneficent「仁慈的」，形容词","beneficial「有益的」，形容词","✓ benefit 名词「利益」，名词所有格后接名词","benefactors「捐助者」，名词但语义不合"],g:"place obligations on...「对…施加义务」。",e:"名词所有格 both sides' 后接名词 benefit。"},
{q:"Jasper is quite ____ with Central Television. He worked there for 25 years.",o:["agreed","familiar","consistent","allied"],a:1,cn:"Jasper 对中央电视台相当熟悉，他在那里工作了25年。",ops:["agreed「同意的」（agree with）","✓ familiar：be familiar with「熟悉」","consistent「一致的」（be consistent with）","allied「结盟的」（be allied with）"],g:"quite 修饰形容词；for + 时间段。",e:"be familiar with「熟悉」：工作25年自然熟悉。"},
{q:"____ the fact that the area had been hit by a severe drought, a fairly good harvest was gathered in.",o:["In spite","Despite","In spite that","Despite of"],a:1,cn:"尽管该地区遭受了严重干旱，仍收获了相当好的收成。",ops:["In spite 后缺 of","✓ Despite 是介词，直接接名词 the fact","In spite that：应为 in spite of the fact that","Despite of：despite 后不加 of，错误形式"],g:"that the area... 是 fact 的同位语从句。",e:"despite 是介词直接接名词；in spite 需加 of；despite of 是错误形式。"},
{q:"The population of Shanghai is about three times as large as ____ of Nanjing.",o:["one","that","it","this"],a:1,cn:"上海的人口大约是南京人口的三倍。",ops:["one 泛指同类中的一个，不特指 the population","✓ that 指代前面的 the population","it 指代「同一个」事物，两地人口是两个概念","this 无此指代用法"],g:"倍数 + as...as「是…的几倍」；同级比较 as large as。",e:"that 指代 the population，避免重复。"},
{q:"The three hours I spent in the school library ____ my old passion for reading.",o:["brought about","brought over","brought up","brought back"],a:3,cn:"我在学校图书馆度过的那三个小时，唤回了我对阅读的旧日热情。",ops:["brought about「导致」","brought over「带来」","brought up「抚养；提出」","✓ brought back「唤回」"],g:"⚠ 此题与资料一第18题完全相同——高频重复题。",e:"bring back「唤回」旧日热情。（重复题：与资料一第18题相同）"},
{q:"Don't ____ to let me know if there is anything I can do for you.",o:["reject","prevent","hesitate","refuse"],a:2,cn:"如果有什么我能帮上忙的，请别犹豫尽管告诉我。",ops:["reject 及物动词，不接 to do","prevent 及物动词「阻止」","✓ hesitate to do sth「别犹豫」","refuse to do 意为「拒绝告知」，语义相反"],g:"⚠ 此题与资料一第8题完全相同——高频重复题。",e:"hesitate to do「别犹豫」。（重复题：与资料一第8题相同）"},
{q:"The flowers in the garden need ____ badly; otherwise they will dry up soon.",o:["watering","to water","watered","to have watered"],a:0,cn:"花园里的花急需浇水，否则很快就会干枯。",ops:["✓ need doing＝need to be done，主动形式表被动","to water：若用不定式应为 need to be watered","watered 过去分词不能单独作此结构宾语","to have watered 完成式不定式，错误"],g:"otherwise「否则」；dry up「干枯」。类似用法的还有 want/require doing。",e:"need doing＝need to be done：「花需要（被）浇水」。"},
{q:"____ the English examination, I would have gone to the exhibition last Sunday.",o:["In spite of","But for","Because of","As for"],a:1,cn:"要不是英语考试，上周日我就去看展览了。",ops:["In spite of「尽管」，让步义","✓ But for「要不是」，接虚拟语气","Because of「因为」，不接虚拟","As for「至于」"],g:"would have gone 是对过去的虚拟结果；last Sunday 过去时间。",e:"But for「要不是」+ 对过去的虚拟。"},
{q:"Who is responsible ____ the arrangements?",o:["for make","to make","to making","for making"],a:3,cn:"谁负责安排（这些事宜）？",ops:["for make：介词后接动词原形，错误","to make：responsible 接 for 不接 to","to making：介词搭配错","✓ for making：be responsible for + 动名词"],g:"疑问词 Who 作主语。",e:"be responsible for 中 for 是介词，后接动名词。"},
{q:"The paint is still wet, ____ !",o:["Be not sure to touch it","Be sure not to touch it","Be sure to not touch it","Don't be sure to touch it"],a:1,cn:"油漆还没干，千万别碰！",ops:["Be not sure to touch：语序错误","✓ Be sure not to do：祈使句的否定式","Be sure to not：not 的位置应在 to 前","Don't be sure to：语义混乱"],g:"祈使句否定式：Don't/Be + not + to do。",e:"祈使句否定：Be sure not to do「千万别做」。"},
{q:"____ , you must show your ticket to go into the cinema.",o:["No matter whoever you are","Whoever you are","Whomever you are","No matter who are you"],a:1,cn:"无论你是谁，进电影院都必须出示票。",ops:["No matter whoever：no matter 与 whoever 重复","✓ Whoever you are 让步从句，whoever 作从句主语","Whomever 是宾格，从句缺主语时不能用","No matter who are you：从句语序错误"],g:"must 表强制要求。",e:"「无论你是谁」用 whoever 引导让步状语从句。"},
{q:"You ____ me, because I didn't say that.",o:["must have misunderstood","must misunderstand","must be misunderstood","had to misunderstand"],a:0,cn:"你一定是误解我了，因为我没那么说过。",ops:["✓ must have done：对过去之事的肯定推测","must misunderstand：对现在推测，且动作已发生","must be misunderstood：被动，语义相反","had to：不得不，非推测"],g:"because 从句给出推测的依据。",e:"must have done「过去一定做过」：我没说过 → 你一定误解了。"}
],

reading:[
{passage:"To us it seems so natural to put up an umbrella to keep the water off when it rains. But actually the umbrella was not invented as protection against rain. It was first used as a shade against the sun.\nNobody knows who first invented it, but the umbrella was used in very ancient times. Probably the first to use it were the Chinese, way back in the eleventh century B.C...\nWe know that the umbrella was also used in ancient Egypt and Babylon as a sunshade. And there was a strange thing connected with its use; it became a symbol of honor and authority. In the Far East in ancient times, the umbrella was allowed to be used only by royal people or by those in high office.\nIn Europe, the Greeks were the first to use the umbrella as a sunshade. And the umbrella was in common use in ancient Greece. But it is believed that the first persons in Europe to use the umbrellas as protection against the rain were the ancient Romans.\nDuring the Middle Ages, the use of the umbrella practically disappeared. Then it appeared again in Italy in 16th century. And again it became a symbol of power and authority.\nUmbrellas have not changed much in style during all this time, though they have become much lighter in weight. It wasn't until the twentieth century that women's umbrellas began to be made in a variety of colors.",
qs:[
{q:"The first use of umbrella was ____ .",o:["protection against rain","a shade against the sun","a symbol of power","a symbol of honor"],a:1,cn:"雨伞最初用作____。",ops:["防雨——发明初衷与此相反","✓ 遮阳（a shade against the sun）","权力象征——后来的演变","荣誉象征——同 C"],e:"首段末句：It was first used as a shade against the sun。"},
{q:"____ were regarded as the people who first used umbrellas.",o:["Romans","Greeks","Chinese","Europeans"],a:2,cn:"____被认为是最早使用伞的人。",ops:["Romans：罗马人是欧洲最早用伞挡雨的","Greeks：希腊人是欧洲最早用伞遮阳的","✓ Chinese：中国人最早使用（公元前11世纪）","Europeans：统称，范围过宽"],e:"第二段：Probably the first to use it were the Chinese。"},
{q:"The umbrella was used only by royal people or those in high office ____ .",o:["in Europe in the eighteenth century","in ancient Egypt and Babylon","in the Far East in ancient times","during the Middle Ages"],a:2,cn:"在____，伞只允许皇室或高官使用。",ops:["十八世纪的欧洲——未提及","古埃及和巴比伦——那里只说用作遮阳","✓ 古代远东（In the Far East in ancient times）","中世纪——那时伞几乎消失"],e:"第三段末句：在古代远东只有皇室和高官能用伞。"},
{q:"Which of the following may be the best title for the passage?",o:["When Was the Umbrella Invented","The Role of Umbrella in History","The Colors and Shapes of Umbrella","Who Needed Umbrella First"],a:1,cn:"以下哪项可能是本文的最佳标题？",ops:["伞何时发明——文中明说无人知晓","✓ 伞在历史上的角色（演变脉络）","伞的颜色和形状——仅末段细节","谁最早需要伞——以偏概全"],e:"主旨题：全文按时间线讲雨伞角色的演变。"}
]},
{passage:"The first year of school in America, known as kindergarten, usually begins between the ages of five and six. Among rich countries such a late start is very strange. President Obama believes it is an economic and social problem; his education secretary goes as far as to say that it is \"morally wrong\". This statement has some support, as it is clear from research into vocabulary that youngsters from poor families enter kindergarten well behind those from rich families — a disadvantage that usually lasts a lifetime. Children from households on welfare knew 525 words by the age of three, while the children of professionals had mastered 1,116.\nPre-school can help close this gap. So in a speech last month, Mr. Obama called for a partnership between the federal government and the states to expand it to every American child. It later became known that \"every\" meant those who come from families with incomes of up to 200% above the poverty line — equal to an income of $47,000 for a family of four.\nSome studies also follow the effects of early learning over lifetimes, such as its effect on crime rates and other factors that may eventually burden society. Critics have singled out a government scheme called Head Start, created in 1965, which provides poor households with a range of services including school-based early education.",
qs:[
{q:"Kindergarten in rich countries other than America usually begins at the age of ____ .",o:["eight","seven","six","four"],a:3,cn:"除美国以外的富裕国家，幼儿园通常从____岁开始。",ops:["eight：比美国更晚，矛盾","seven：同上","six：与美国持平，不算更早","✓ four：美国5-6岁已算「很晚」→ 他国更早，仅四岁符合"],e:"推理题：such a late start is very strange → 其他发达国家入学更早。"},
{q:"According to the passage, which of the following is TRUE?",o:["Poor pre-school kids have a larger vocabulary than rich kids.","President Obama believes that early education can solve all economic and social problems.","Rich pre-school kids have a richer vocabulary than poor kids.","President Obama's education secretary thinks it is morally wrong to let kids start kindergarten early."],a:2,cn:"根据文章，下列哪项是正确的？",ops:["贫困家庭孩子词汇量更大——数字正好相反","奥巴马认为早教能解决所有问题——过于绝对","✓ 富裕家庭孩子词汇量更大（1116 对 525）","教育部长认为「早上学」错误——曲解，错的是「太晚开始」"],e:"细节题：专业人士家庭孩子3岁掌握1116词，贫困家庭525词。"},
{q:"The phrase 'single out' in the last paragraph means ____ .",o:["choose","think about","count","depend on"],a:0,cn:"最后一段中的 single out 意为____。",ops:["✓ choose「挑选出」","think about「考虑」","count「数数」","depend on「依赖」"],e:"词义猜测：批评者们挑选出 Head Start 项目来批评。"},
{q:"Which of the following is an appropriate title for this passage?",o:["Secondary Education","Pre-school Education","Poor Kids' Education","Rich Kids' Education"],a:1,cn:"以下哪项是本文合适的标题？",ops:["Secondary Education「中等教育」——偏离主题","✓ Pre-school Education「学前教育」","Poor Kids' Education——片面","Rich Kids' Education——片面"],e:"主旨题：全文讨论学前教育的重要性与普及。"}
]}
],
trans:[

{en:"Believe in yourself, and you'll win the speech contest.",zh:"只要相信你自己，你就会赢得演讲比赛。",e:"「祈使句 + and + 陈述句」结构，祈使句相当于条件句；believe in oneself 相信自己。"},
{en:"It is of great importance for college students to take part in social practice.",zh:"大学生参加社会实践是很重要的。",e:"be of great importance＝very important；take part in 参加；social practice 社会实践。"},
{en:"If it hadn't been for your help, I couldn't have made such great progress in English.",zh:"要是没有你的帮助，我就不可能在英语方面取得这样大的进步。",e:"对过去的虚拟语气：if + had done，主句 couldn't have done；make progress in 在……取得进步。"},
{en:"We strive for perfection but sometimes have to accept something less than perfect.",zh:"我们力求完美，但有时不得不接受不那么完美的事。",e:"strive for 力求、奋斗争取；have to 不得不；less than perfect 不那么完美。"}
]},
{name:"复习资料三",
p1:[
{q:"My friend told me the house I would rent was small and contained too ____ .",o:["much furniture","much furnitures","many furniture","many furnitures"],a:0,cn:"朋友告诉我，我要租的房子很小，家具太多了。",ops:["✓ furniture 不可数名词，用 much 修饰","furnitures：furniture 无复数形式","many furniture：many 修饰可数名词","many furnitures：双重错误"],g:"I would rent 是省略 that 的定语从句修饰 the house。",e:"furniture（家具）不可数：too much furniture。"},
{q:"Someone is knocking at the door, but whom can ____ be?",o:["one","he","it","she"],a:2,cn:"有人在敲门，会是谁呢？",ops:["one 泛指「某个人/物」，不用于此猜测句型","he 指明确的男性，敲门者身份不明","✓ it 指身份不明的人（谁在敲门？）","she 同 he，指明确的女性"],g:"knock at the door「敲门」。",e:"身份不明的人敲门，习惯用 it 指代：whom can it be??"},
{q:"—What about having a picnic at the beach this Saturday? —It ____ good.",o:["smells","feels","sounds","looks"],a:2,cn:"——这周六去海滩野餐怎么样？——听起来不错。",ops:["smells「闻起来」","feels「摸起来/感觉」","✓ sounds「听起来」——对提议的评价","looks「看起来」"],g:"What about...? 提建议的句型；It 指这个提议。",e:"对提议的评价「听起来不错」→ sounds good。"},
{q:"In the past 40 years of reform and opening up, China ____ great progress.",o:["have made","has made","had made","having made"],a:1,cn:"改革开放40年来，中国取得了巨大进步。",ops:["have made：主语 China 是单数","✓ has made：in the past 40 years 是现在完成时标志","had made：过去完成时无依据","having made：非谓语不能单独作谓语"],g:"in the past / in the last + 时间段 → 现在完成时。",e:"in the past 40 years 是现在完成时标志；China 单数 → has made。"},
{q:"Our companies need to employ ____ workers than before.",o:["as excellent","excellent","most excellent","more excellent"],a:3,cn:"我们公司需要雇用比以前更优秀的工人。",ops:["as excellent：缺第二个 as，无法搭配","excellent：原级，与句末 than 冲突","most excellent：最高级不与 than 连用","✓ more excellent：比较级 + than"],g:"employ＝hire「雇用」。",e:"句末 than before → 用比较级 more excellent。"},
{q:"The children ____ aloud when the teacher came in.",o:["was reading","were reading","read","have read"],a:1,cn:"老师进来时，孩子们正在大声朗读。",ops:["was reading：children 是复数，主谓不一致","✓ were reading：过去进行时 + 复数","read：一般过去时，无「正在进行」义","have read：现在完成时与 when 从句不搭"],g:"when the teacher came in 是过去时间锚点 → 过去进行时。",e:"「老师进来时正在朗读」→ 过去进行时 were reading。"},
{q:"Our teaching building ____ next month.",o:["will be completed","completes","has completed","was completed"],a:0,cn:"我们的教学楼将于下个月完工。",ops:["✓ will be completed：一般将来时 + 被动","completes：主动且表习惯性动作","has completed：主动 + 完成时","was completed：过去被动，与 next month 矛盾"],g:"next month 是将来时间标志；楼是「被完工」。",e:"next month 表将来；教学楼「被完成」→ will be completed。"},
{q:"Johnson will phone his girlfriend as soon as he ____ at the airport.",o:["will arrive","is arriving","arrives","arrived"],a:2,cn:"Johnson 一到机场就会给女朋友打电话。",ops:["will arrive：时间状语从句中不用将来时","is arriving：进行表将来仅限部分语境，此处惯用一般现在时","✓ arrives：一般现在时代替将来时","arrived：过去时与主句矛盾"],g:"as soon as「一…就…」，主将从现。",e:"时间状语从句用一般现在时代替将来时。"},
{q:"There is ____ letter 'h' in the word 'hour', but ____ 'h' doesn't make a sound.",o:["a; a","a; the","the; an","an; the"],a:3,cn:"单词 hour 里有一个字母 h，但这个 h 不发音。",ops:["a; a：h 以元音音素开头应用 an","a; the：同上，首词冠词错误","the; an：顺序与用法全反","✓ an（/eɪtʃ/ 元音音素开头）；the（第二次提及）"],g:"判断 a/an 看发音（音素）而非字母；再提同一事物用 the。",e:"字母 h 发音 /eɪtʃ/ 以元音开头 → an；第二次提到用 the。"},
{q:"John spent a lot of time ____ to his friends why he came late.",o:["explain","explained","to explain","explaining"],a:3,cn:"John 花了很多时间向朋友们解释他为什么迟到。",ops:["explain 动词原形，不能作宾语","explained 过去式，句法错误","to explain：spend...doing 固定搭配","✓ explaining：spend time (in) doing sth"],g:"why he came late 是 explaining 的宾语从句。",e:"spend time doing sth「花时间做某事」。"},
{q:"The old man came upstairs ____ a stick for support.",o:["held","holding","being holding","was holding"],a:1,cn:"老人拄着拐杖上楼。",ops:["held 过去分词，表被动义（拐杖不是被老人举着走）","✓ holding 现在分词作伴随状语","being holding 无此形式","was holding 会造成双谓语"],g:"for support 作目的状语「以作支撑」。",e:"现在分词 holding 作伴随状语：拄着拐杖上楼。"},
{q:"On our website you will find a list of problems ____ at our next week's meeting.",o:["discuss","discussing","to be discussed","discussed"],a:2,cn:"在我们网站上你会看到将在下周会议上讨论的问题清单。",ops:["discuss 主动原形，无被动义","discussing 主动进行","✓ to be discussed：不定式表将来 + 被动","discussed 过去分词表已完成的被动"],g:"a list of「…的清单」。",e:"「下周将要讨论的问题」→ 不定式被动 to be discussed。"},
{q:"Whether you come ____ not will be up to you.",o:["so","and","or","but"],a:2,cn:"你来不来由你自己决定。",ops:["so 无此搭配","and 无此搭配","✓ whether...or not 固定搭配","but 无此搭配"],g:"be up to sb「由某人决定」。",e:"whether...or not「是否」，固定搭配。"},
{q:"Most of the goods ____ in this store are made by our company.",o:["sell","sold","selling","be sold"],a:1,cn:"这家店出售的大部分商品都是我们公司生产的。",ops:["sell 主动且形式错误","✓ sold 过去分词作后置定语，表被动「被售的」","selling 主动进行","be sold 不能作后置定语"],g:"Most of + 复数名词作主语，谓语用复数 are made。",e:"goods 与 sell 是被动关系 → sold 作后置定语。"},
{q:"Our teacher suggests that we ____ in the classroom earlier.",o:["should be","shall be","are","were"],a:0,cn:"老师建议我们早点到教室。",ops:["✓ (should+) 动词原形的虚拟语气","shall be 陈述语气","are 一般现在时，非虚拟","were 过去式，与虚拟式不符"],g:"suggest「建议」→ 宾语从句虚拟，should 可省略。",e:"suggest 表示「建议」时，从句用 (should+) 动词原形。"},
{q:"____ you want some samples of our products, you might contact our sales manager.",o:["While","If","Until","Although"],a:1,cn:"如果你想要我们产品的样品，可以联系销售经理。",ops:["While「虽然；当…时」","✓ If「如果」，条件关系","Until「直到」","Although「尽管」"],g:"might 表委婉建议；sales manager「销售经理」。",e:"条件句：想要样品 → 联系销售经理。"},
{q:"It was such a strong storm ____ it caused great damage to this area.",o:["because","as","since","that"],a:3,cn:"那场暴风雨如此猛烈，给该地区造成了巨大损失。",ops:["because「因为」，逻辑颠倒","as：such...as 后接成分不同，此处是结果","since「因为」","✓ that：such...that「如此…以至于」"],g:"cause damage to「对…造成损害」。",e:"such...that「如此…以至于」引导结果状语从句。"},
{q:"No sooner had he jumped out of the car ____ it blew up.",o:["than","while","when","as"],a:0,cn:"他刚跳下车，车就爆炸了。",ops:["✓ than：no sooner...than 固定搭配","while「与…同时」，与过去完成时不搭","when：hardly...when 才用 when","as 无此搭配"],g:"No sooner 置句首 → 过去完成时倒装 had he jumped。",e:"no sooner...than「一…就…」。"},
{q:"It was not until last month ____ the machine we ordered arrived.",o:["which","what","that","where"],a:2,cn:"直到上个月，我们订购的机器才到货。",ops:["which 引导定语从句，此处是强调句","what 不能用于强调句","✓ that：It was not until...that 强调句型","where 地点关系，不符"],g:"we ordered 是省略 which/that 的定语从句修饰 machine。",e:"强调句型：It was not until...that...。"},
{q:"Go to the evening party with me tonight, ____ ?",o:["can you","don't you","do you","will you"],a:3,cn:"今晚陪我去的晚会，好吗？",ops:["can you：邀请/请求多用 will you","don't you：祈使句反问不用否定助动结构","do you：祈使句反问不用 do","✓ will you：祈使句的反义疑问固定用 will you"],g:"祈使句本身无时态人称，反义疑问用 will/won't you。",e:"祈使句的反义疑问句用 will you。"}
],
cloze:{passage:"It's been five years since I came to America. The year before I arrived, every weekend I was woken up by \"Spring River in the Flower Moon Night\", {21} by my mother on a guzheng. My mom was always enchanted by the beauty of Chinese traditional music, {22} she never had the chance to learn a {23}. In 2009, she got a guzheng from a friend and has been playing and performing ever since. Sometimes when I {24} her, I search for the songs she used to play on the Internet. I {25} expected to hear them here in Boston. Earlier this year, as I {26} a new apartment, I met Zhantao Lin, the director of the Boston Chinese Musicians Association. At Lin's house, I heard the {27} of the erhu. Lin later {28} me to his music team and I heard them rehearse for a {29} this year. It was beautiful and powerful and it {30} brought me back to my hometown in China. {31} is also part of Lin's daily routine. Besides performing, he passed on his love of the erhu to his {32}. I went to one of Lin's classes and met 9-year-old London Turk. I asked him {33} he chose to learn the erhu. \"It's much {34} to learn than the violin,\" he said. Perhaps Turk hasn't really started to {35} the beauty of the erhu, but his mother has always loved the instrument. \"There are so many beautiful things in Chinese {36}, the music, the language, and the art. So we just try our best to let him have a {37} to explore it,\" she said. I {38} my mom for giving me a chance to immerse myself in the Chinese musical world. The music makes me feel relaxed. It can also {39} me of my homesickness. If you listen to one piece, you will {40} its uniqueness, power, and beauty.",
qs:[
{o:["directed","played","written","invented"],a:1,cn:"我来美国的前一年，每个周末都会被妈妈用古筝弹奏的《春江花月夜》唤醒。",ops:["directed「指挥、指导」","✓ played「弹奏」，过去分词作后置定语（曲子是被弹的）","written「谱写」，与 on a guzheng 矛盾","invented「发明」"],g:"be woken up by「被…唤醒」。",e:"played by my mother 过去分词作后置定语。"},
{o:["but","and","or","so"],a:0,cn:"妈妈一直着迷于中国传统音乐之美，却从未有机会学一门乐器。",ops:["✓ but 转折：着迷 vs 没机会学","and 顺承，逻辑不合","or 选择","so 因果"],g:"be enchanted by「被…迷住」。",e:"前后转折 → but。"},
{o:["instrument","trade","language","trick"],a:0,cn:"（同上句）却从未有机会学一门乐器。",ops:["✓ instrument「乐器」，与后文 guzheng、erhu 呼应","trade「手艺；贸易」","language「语言」","trick「把戏；技巧」"],g:"get...from a friend「从朋友那里得到」。",e:"learn an instrument「学一门乐器」。"},
{o:["mention","chase","miss","call"],a:2,cn:"有时我想念她时，就在网上搜索她以前常弹的曲子。",ops:["mention「提及」","chase「追逐」","✓ miss「想念」","call「打电话」，与后文搜歌矛盾"],g:"used to play「过去常常弹」。",e:"想念妈妈时搜她弹过的曲子 → miss。"},
{o:["only","still","already","never"],a:3,cn:"我从未想过会在波士顿听到这些曲子。",ops:["only「仅仅」","still「仍然」","already「已经」","✓ never「从未」"],g:"here 指 Boston。",e:"从没想过能在这里听到 → never expected。"},
{o:["looked after","looked at","looked for","looked in"],a:2,cn:"今年早些时候，我找新公寓时遇到了 Zhantao Lin——波士顿华人音乐家协会会长。",ops:["looked after「照顾」","looked at「看」","✓ looked for「寻找」","looked in「顺路拜访」"],g:"the director of...「…的会长」。",e:"look for a new apartment「找新公寓」。"},
{o:["story","sound","name","cry"],a:1,cn:"在 Lin 的家里，我听到了二胡的声音。",ops:["story「故事」","✓ sound「声音」","name「名字」","cry「哭声」"],g:"erhu 即「二胡」。",e:"the sound of the erhu「二胡的声音」。"},
{o:["followed","recommended","guided","introduced"],a:3,cn:"Lin 后来把我介绍进他的乐队，我听他们为今年的演出排练。",ops:["followed「跟随」","recommended 应为 recommend sb as 结构","guided「引导」（guide sb to do）","✓ introduced：introduce sb to...「介绍…进入」"],g:"rehearse「排练」。",e:"introduce me to his music team。"},
{o:["performance","competition","game","conference"],a:0,cn:"（同上句）为今年的演出排练。",ops:["✓ performance「演出」，与 rehearse 呼应","competition「比赛」","game「游戏」","conference「会议」"],g:"beautiful and powerful 并列形容词。",e:"排练的目的是演出 → performance。"},
{o:["secretly","recently","nearly","suddenly"],a:3,cn:"音乐美妙而有力，突然把我带回了中国的老家。",ops:["secretly「暗地里」","recently「最近」","nearly「几乎」","✓ suddenly「突然」"],g:"bring back「带回」。",e:"音乐「突然」把他带回故乡。"},
{o:["Reading","Teaching","Composing","Exercising"],a:1,cn:"教学也是 Lin 日常的一部分。",ops:["Reading「阅读」","✓ Teaching「教学」，下文去上他的课印证","Composing「作曲」","Exercising「锻炼」"],g:"daily routine「日常安排」；besides「除…之外（还）」。",e:"Besides performing（除了演出）→ 教学 Teaching。"},
{o:["workmates","friends","students","parents"],a:2,cn:"除了演出，他把对二胡的热爱传授给学生。",ops:["workmates「同事」","friends「朋友」","✓ students「学生」，下文去他班上印证","parents「父母」"],g:"pass on...to...「把…传给…」。",e:"把热爱传给学生 → students。"},
{o:["how","where","why","when"],a:2,cn:"我问他为什么选择学二胡。",ops:["how「如何」","where「哪里」","✓ why「为什么」，他的回答正是在说原因","when「何时」"],g:"choose to do「选择做」。",e:"答语解释原因 → 问的是 why。"},
{o:["easier","longer","safer","smarter"],a:0,cn:"「它比小提琴好学多了。」他说。",ops:["✓ easier：句末 than the violin → 比较级","longer「更长」","safer「更安全」","smarter「更聪明」"],g:"直接引语用引号。",e:"much + 比较级 + than。"},
{o:["consider","enjoy","ignore","expect"],a:1,cn:"或许 Turk 还没真正开始欣赏二胡之美，但他妈妈一直热爱这件乐器。",ops:["consider「考虑」","✓ enjoy「欣赏」","ignore「忽视」，语义相反","expect「期待」"],g:"has always loved 现在完成时。",e:"还没开始「欣赏」二胡之美 → enjoy。"},
{o:["medicine","economy","literature","culture"],a:3,cn:"「中国文化里有这么多美好的东西：音乐、语言、艺术。」",ops:["medicine「医学」","economy「经济」","literature「文学」","✓ culture「文化」，后文列举音乐、语言、艺术"],g:"so many + 复数名词。",e:"音乐、语言、艺术属于文化 → culture。"},

reading:[
{passage:"I'm very thankful to the cat and it always makes me think of the time I was with him.\nFive years ago, when my father was dying, I travelled a thousand miles from home to be with him in his last days. I felt very sad and it was one of the most difficult and painful times in my life. After he passed away, I stayed alone in his flat. There were so many things to deal with. I was lonely and I hated the silence of the flat.\nBut one evening the silence was broken: I heard crying outside. I opened the door to find a little cat on the steps. He was thin and poor. He looked the way I felt. I brought him inside and gave him a can of fish. He ate it and then almost immediately fell asleep.\nThe next morning I checked with neighbors and learned that the cat had been left by his owner. His owner had moved out, so the little cat was there all alone, just like I was. As I walked back to the flat, I tried to work out what to do with him. Having something else to take care of seemed like the very last thing I needed. But as soon as I opened the flat door, he ran to me and jumped into my arms. It was clear from that moment that he didn't want to go anywhere. I started calling him Willis in order to remember my father's best friend.\nFrom then on, things grew easier. With Willis in my lap, time seemed to pass much faster. When the time finally came for me to return home, I had to decide what to do about Willis. There was absolutely no way I would leave without him.\nIt's been five years since my father died. Over the years, several people have said how nice it was of me to rescue the cat. But I know that we rescued each other. I may have given him a home but he gave me something greater.",
qs:[
{q:"The writer felt ____ after her father passed away.",o:["happy","lonely","nervous","relaxed"],a:1,cn:"父亲去世后，作者感到____。",ops:["happy「开心的」","✓ lonely「孤独的」（I was lonely and I hated the silence）","nervous「紧张的」","relaxed「放松的」"],e:"细节题：I was lonely and I hated the silence of the flat。"},
{q:"As soon as the writer saw the cat, she ____ .",o:["had pity on him","showed no interest in him","felt very frightened","felt angry with his crying"],a:0,cn:"作者一见到那只猫，就____。",ops:["✓ 对它心生怜悯（它又瘦又可怜，像极了自己）","对它毫无兴趣","感到非常害怕","对它的哭声感到生气"],e:"He looked the way I felt，随即把它抱进屋喂鱼 → 怜悯。"},
{q:"The cat rescued the writer by ____ .",o:["telling her what real life was","helping her tidy the flat every day","helping her finish the tasks on time","making her feel better in her hard times"],a:3,cn:"这只猫通过____拯救了作者。",ops:["告诉她什么是真正的生活","每天帮她收拾公寓","帮她按时完成任务","✓ 在她的艰难时期让她好受些"],e:"结尾 we rescued each other：它的陪伴让时间过得更快。"},
{q:"What's the best title for the passage?",o:["A lovely cat","My father and a cat","What I got from a cat","How to take care of a cat"],a:2,cn:"这篇文章的最佳标题是什么？",ops:["A lovely cat「一只可爱的猫」——停留表面","My father and a cat「我的父亲和一只猫」——并列失当","✓ What I got from a cat「我从一只猫那里得到了什么」","How to take care of a cat「如何照顾猫」——离题"],e:"主旨题：结尾点题——我给了它一个家，它给了我更宝贵的东西。"}
]},
{passage:"My friend Matt and I arrived at the Activity Centre on Friday evening. The accommodation wasn't wonderful, but we had everything we needed (beds, blankets, food), and we were pleased to be out of the city and in the fresh air.\nOn Saturday morning we met the other ten members of our group. Cameron had come along with two friends, Kevin and Simon, while sisters Carole and Lynn had come with Amanda. There were some other members I didn't know. We had come from different places and none of us knew the area.\nWe knew we were going to spend the weekend outdoors, but none of us was sure exactly how. Half of us went to the caves first. Climbing out was harder than going in, but after a good deal of pushing, we were out at last. Though we were covered with mud, we were pleased and excited by what we'd done.",

cloze:{passage:"Making friends is a skill. Like most skills, it {21} patience. If you want to meet people and make friends, you must be willing to {22} some action. You must first go where there are people. You won't make friends staying home {23}. Joining a club or group, talking to those who like the same things {24} you do is much easier. Or join someone {25} some activity.\nMany people are {26} when talking to new people. {27} meeting strangers means seeing the unknown. And it's human nature to feel a bit {28} about the unknown. Most of fears about {29} new people come from doubts about {30}. We imagine other people are {31} us — finding us too tall or too short, too this or too that. But don't forget that they must be feeling the same way. Try to accept yourself {32} you are, and try to put the other at ease. You'll both feel more comfortable.\nTry to act self-confident {33} you don't feel that way when you {34} a room full of strangers. Walk straight, look at other people directly and {35}. If you see someone you'd like to {36}, say something. Don't wait for {37} person to start a talk. Just meeting someone {38} does not mean that you'll make friends with that person. {39} is based on mutual liking and \"give and take\". It takes time to {40} friendship.",

      /* ===================== 工具 ===================== */
      const $ = (s) => document.querySelector(s);
      const LETTERS = ["A", "B", "C", "D"];
      const esc = (t) =>
        String(t == null ? "" : t)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      const shuffle = (a) => {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      };
      const sample = (a, n) => shuffle(a).slice(0, n);
      const fmtQ = (t) => esc(t).replace(/_{2,}/g, '<span class="ub"></span>');
      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(t._h);
        t._h = setTimeout(() => t.classList.remove("show"), 2200);
      }

      /* ===================== 题库索引 ===================== */
      const P1POOL = [];
      const READGROUPS = [];
      const TRPOOL = [];
      PAPERS.forEach((p, pi) => {
        p.p1.forEach((q, i) =>
          P1POOL.push(Object.assign({ pid: pi, sec: 1, idx: i }, q)),
        );
        p.reading.forEach((r, ri) =>
          READGROUPS.push({
            pid: pi,
            ri,
            passage: r.passage,
            qs: r.qs.map((q, i) =>
              Object.assign({ pid: pi, sec: 3, idx: ri * 4 + i }, q),
            ),
          }),
        );
        p.trans.forEach((t, i) =>
          TRPOOL.push(Object.assign({ pid: pi, sec: 4, idx: i }, t)),
        );
      });
      const CLOZEPOOLS = PAPERS.map((p, pi) => ({
        pid: pi,
        passage: p.cloze.passage,
        qs: p.cloze.qs.map((q, i) =>
          Object.assign({ pid: pi, sec: 2, idx: i }, q),
        ),
      }));
      function srcLabel(it) {
        const n = "资料" + "一二三四"[it.pid];
        if (it.sec === 1) return n + " · 词汇第" + (it.idx + 1) + "题";
        if (it.sec === 2) return n + " · 完形第" + (it.idx + 21) + "题";
        if (it.sec === 3) return n + " · 阅读第" + (41 + it.idx) + "题";
        return n + " · 翻译第" + (49 + it.idx) + "句";
      }
      function clozeWord(pid, idx) {
        const q = PAPERS[pid].cloze.qs[idx];
        return q.o[q.a];

      /* ===================== 本地存储 ===================== */
      /* 通过本地服务器访问时（api/state 可达），记录存 Mac 端 SQLite(records.db)，
         手机/电脑共用一份；直接双击打开(file://)时退回浏览器 localStorage */
      let SAVE = null,
        SERVER = false,
        DIRTY = false;
      function defaultSave() {
        return { wrong: {}, stats: { n: 0, correct: 0, total: 0 } };
      }
      function loadLocal() {
        try {
          SAVE = JSON.parse(localStorage.getItem("xueweiEn") || "") || null;
        } catch (e) {
          SAVE = null;
        }
        if (!SAVE || typeof SAVE !== "object" || !SAVE.stats)
          SAVE = defaultSave();
      }
      function persist() {
        DIRTY = true;
        try {
          localStorage.setItem("xueweiEn", JSON.stringify(SAVE));
        } catch (e) {}
        if (SERVER)
          fetch("api/state", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(SAVE),
            keepalive: true,
          })
            .then(() => (DIRTY = false))
            .catch(() => {});
      }
      async function initStore() {
        try {
          const c = new AbortController();
          const t = setTimeout(() => c.abort(), 1500);
          const r = await fetch("api/state", {
            signal: c.signal,
            cache: "no-store",
          });
          clearTimeout(t);
          if (r.ok) {
            const j = await r.json();
            SERVER = true;
            if (j && j.state && j.state.stats) {
              SAVE = j.state;
            } else {
              // 服务器还没有记录：把本浏览器里的旧记录迁移上去
              loadLocal();
              if (SAVE.stats.n > 0 || Object.keys(SAVE.wrong).length) persist();
            }
            return;
          }
        } catch (e) {}
        loadLocal();
      }
      addEventListener("pagehide", () => {
        if (SERVER && DIRTY && navigator.sendBeacon) {
          navigator.sendBeacon("api/state", JSON.stringify(SAVE));
          DIRTY = false;
        }
      });

      /* ===================== 全局状态 ===================== */
      let QUIZ = null;
      const MODES = {
        mock: {
          name: "随机仿真卷",
          icon: "🎲",
          desc: "语法20题+完形1篇+阅读2篇+翻译5句 · 满分85分",
        },

          name: "语法词汇专项",
          icon: "✏️",
          desc: "从四套卷80题中随机抽20题",
        },

        read: { name: "阅读理解专项", icon: "📖", desc: "随机2篇（8题）" },
        trans: { name: "翻译专项", icon: "🈶", desc: "随机5句 · 英译汉" },
        wrong: { name: "错题重练", icon: "🔁", desc: "重做所有做错过的题" },
      };

      /* ===================== 首页 ===================== */

  <div class="foot">全部题目来自老师发的四份复习资料 · 做错的题自动进错题本<br>

        window.scrollTo(0, 0);
